<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TH.badminton</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 指向 Manifest 檔案（Android / Chrome） -->
  <link rel="manifest" href="manifest.json">
  <!-- iOS Safari 主頁面圖示 -->
  <link rel="apple-touch-icon" href="icon_1.png">
  <!-- 設定 iOS 狀態欄顏色 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TH.badminton">
</head>
<body style="margin: 0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BadmintonCoachApp() {
      const APP_VERSION = "v4.2.2";
      const LAST_UPDATED = "2026-10-08 14:00";

      // 深色/淺色模式狀態 (預設讀取 localStorage 或系統偏好)
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const saved = localStorage.getItem('th_badminton_darkMode');
        if (saved !== null) return JSON.parse(saved);
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      useEffect(() => {
        localStorage.setItem('th_badminton_darkMode', JSON.stringify(isDarkMode));
      }, [isDarkMode]);

      // 主題顏色定義
      const theme = {
        bg: isDarkMode ? '#121212' : '#f8f9fa',
        cardBg: isDarkMode ? '#1e1e1e' : '#ffffff',
        textPrimary: isDarkMode ? '#e0e0e0' : '#1a1a1a',
        textSecondary: isDarkMode ? '#a0a0a0' : '#555555',
        textMuted: isDarkMode ? '#777777' : '#888888',
        border: isDarkMode ? '#2c2c2c' : '#e0e0e0',
        inputBg: isDarkMode ? '#2d2d2d' : '#ffffff',
        inputText: isDarkMode ? '#e0e0e0' : '#333333',
        inputBorder: isDarkMode ? '#444444' : '#cccccc',
        modalBg: isDarkMode ? '#1e1e1e' : '#ffffff',
        tableHeader: isDarkMode ? '#252525' : '#f1f3f5',
        shadow: isDarkMode ? '0 1px 3px rgba(0,0,0,0.4)' : '0 1px 3px rgba(0,0,0,0.05)',
        accent: '#5b8bf7',
        accentHover: '#4a75e0'
      };

      const getRealTodayString = () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const getMonthString = (dateStr) => dateStr.substring(0, 7);

      const [todayStr, setTodayStr] = useState(getRealTodayString());
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedMonth, setSelectedMonth] = useState(getMonthString(todayStr));

      const [showAmount, setShowAmount] = useState(false);
      const [activeTab, setActiveTab] = useState('schedule');
      const [expandedPayers, setExpandedPayers] = useState({});

      const togglePayerExpand = (payerName) => {
        setExpandedPayers(prev => ({
          ...prev,
          [payerName]: !prev[payerName]
        }));
      };

      useEffect(() => {
        if (activeTab !== 'revenue') {
          setShowAmount(false);
        }
      }, [activeTab]);

      useEffect(() => {
        const interval = setInterval(() => {
          const currentRealToday = getRealTodayString();
          if (currentRealToday !== todayStr) {
            setTodayStr(currentRealToday);
          }
        }, 60000);
        return () => clearInterval(interval);
      }, [todayStr]);

      // 墊支人名單狀態
      const [courtPayers, setCourtPayers] = useState(() => {
        const saved = localStorage.getItem('th_badminton_courtPayers');
        return saved ? JSON.parse(saved) : ['待定', 'TH Coach', 'Yan'];
      });
      const [newPayerInput, setNewPayerInput] = useState('');

      // 預設課程種類
      const [courseTypes, setCourseTypes] = useState(() => {
        const saved = localStorage.getItem('th_badminton_courseTypes');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: '1人私教', maxCapacity: 1, duration: '1小時', feeMode: 'per_lesson', defaultCoachFee: 500, defaultCourtFee: 150 },
          { id: '2', name: '2-4人小班', maxCapacity: 4, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 200, defaultCourtFee: 200 },
          { id: '3', name: '5-8人中班', maxCapacity: 8, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 150, defaultCourtFee: 240 },
          { id: '4', name: '8人以上大班', maxCapacity: 12, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 120, defaultCourtFee: 300 },
        ];
      });

      const [editingCourseTypeId, setEditingCourseTypeId] = useState(null);

      // 學員列表
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('th_badminton_students');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: '張小明', phone: '91234567', level: '近初', notes: '習慣右手，想練高遠球' },
          { id: 2, name: '李阿華', phone: '98765432', level: '初中', notes: '主力練雙打平抽' }
        ];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [studentForm, setStudentForm] = useState({ id: null, name: '', phone: '', level: '新手', notes: '' });

      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [showEditStudentModal, setShowEditStudentModal] = useState(false);
      const [selectedStudentModal, setSelectedStudentModal] = useState(null);

      // 課表資料
      const [schedule, setSchedule] = useState(() => {
        const saved = localStorage.getItem('th_badminton_schedule');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            courseName: '1人私教',
            maxCapacity: 1,
            feeMode: 'per_lesson',
            coachFee: 500,
            courtFee: 150,
            courtPayer: 'TH Coach',
            date: todayStr,
            startTime: '19:00',
            endTime: '20:00',
            court: '中山紀念公園體育館',
            enrolledStudents: [{ name: '張小明', isPaid: false, payMethod: 'FPS' }]
          }
        ];
      });

      useEffect(() => { localStorage.setItem('th_badminton_courtPayers', JSON.stringify(courtPayers)); }, [courtPayers]);
      useEffect(() => { localStorage.setItem('th_badminton_courseTypes', JSON.stringify(courseTypes)); }, [courseTypes]);
      useEffect(() => { localStorage.setItem('th_badminton_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('th_badminton_schedule', JSON.stringify(schedule)); }, [schedule]);

      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [selectedLessonModal, setSelectedLessonModal] = useState(null);

      // 續堂 Modal 狀態
      const [showRenewModal, setShowRenewModal] = useState(false);
      const [renewForm, setRenewForm] = useState({
        originalLesson: null,
        date: '',
        startTime: '19:00',
        endTime: '21:00',
        court: '',
        courtPayer: 'TH Coach',
        keepStudents: true
      });

      const [addStudentSelect, setAddStudentSelect] = useState('');
      const [addStudentCustom, setAddStudentCustom] = useState('');

      const [courseTypeForm, setCourseTypeForm] = useState({ name: '', maxCapacity: 4, feeMode: 'per_person', defaultCoachFee: '', defaultCourtFee: '' });

      const [lessonForm, setLessonForm] = useState({
        id: null,
        courseTypeId: '1',
        courseName: '1人私教',
        maxCapacity: 1,
        feeMode: 'per_lesson',
        coachFee: 500,
        courtFee: 150,
        courtPayer: 'TH Coach',
        customCourtPayer: '',
        date: todayStr,
        startTime: '19:00',
        endTime: '21:00',
        court: ''
      });

      const handleAddCourtPayer = () => {
        const trimmed = newPayerInput.trim();
        if (!trimmed) return;
        if (courtPayers.includes(trimmed)) {
          alert('該墊支人已在名單中！');
          return;
        }
        setCourtPayers([...courtPayers, trimmed]);
        setNewPayerInput('');
      };

      const handleDeleteCourtPayer = (payer) => {
        if (payer === '待定') {
          alert('「待定」為系統預設選項，無法刪除！');
          return;
        }
        if (window.confirm(`⚠️ 確定要從名單中刪除墊支人「${payer}」嗎？\n\n提示：刪除此名單不會影響先前已記錄的歷史課堂與收支紀錄。`)) {
          if (window.confirm(`再次確認：您真的要刪除「${payer}」嗎？`)) {
            setCourtPayers(courtPayers.filter(p => p !== payer));
          }
        }
      };

      const getStudentCompletedLessonCount = (studentName) => {
        const realToday = getRealTodayString();
        return schedule.filter(lesson => 
          lesson.date <= realToday && 
          lesson.enrolledStudents && 
          lesson.enrolledStudents.some(s => s.name === studentName)
        ).length;
      };

      const timeToMinutes = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
      };

      const isLessonOverlapped = (currentLesson, dayLessons) => {
        const startA = timeToMinutes(currentLesson.startTime || currentLesson.time);
        const endA = timeToMinutes(currentLesson.endTime) || (startA + 60);

        return dayLessons.some(other => {
          if (other.id === currentLesson.id) return false;
          const startB = timeToMinutes(other.startTime || other.time);
          const endB = timeToMinutes(other.endTime) || (startB + 60);

          return startA < endB && startB < endA;
        });
      };

      const handleOpenAddModal = () => {
        const defaultType = courseTypes[0] || { id: '1', name: '1人私教', maxCapacity: 1, feeMode: 'per_lesson', defaultCoachFee: 500, defaultCourtFee: 150 };
        setLessonForm({
          id: null,
          courseTypeId: defaultType.id,
          courseName: defaultType.name,
          maxCapacity: defaultType.maxCapacity,
          feeMode: defaultType.feeMode || 'per_person',
          coachFee: defaultType.defaultCoachFee,
          courtFee: defaultType.defaultCourtFee,
          courtPayer: courtPayers[1] || 'TH Coach',
          customCourtPayer: '',
          date: selectedDate,
          startTime: '19:00',
          endTime: '21:00',
          court: ''
        });
        setShowAddModal(true);
      };

      const calculateTotalFee = (item, customStudentCount = null) => {
        const coach = Number(item.coachFee) || 0;
        const court = Number(item.courtFee) || 0;
        const count = customStudentCount !== null 
          ? customStudentCount 
          : (item.enrolledStudents ? item.enrolledStudents.length : 0);

        if (item.feeMode === 'per_person') {
          return (coach * count) + court;
        } else {
          return coach + court;
        }
      };

      const openWhatsApp = (phone) => {
        if (!phone) {
          alert('⚠️ 該學員未填寫電話號碼！');
          return;
        }
        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length === 8) cleanPhone = '852' + cleanPhone;
        window.open(`https://wa.me/${cleanPhone}`, '_blank');
      };

      const getDateOffsetStr = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().split('T')[0];
      };

      const tomorrowStr = getDateOffsetStr(1);
      const day7Str = getDateOffsetStr(7);

      const getNext7DaysRange = () => {
        const range = [];
        const baseDate = new Date();
        for (let i = 1; i <= 7; i++) {
          const d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          range.push(d.toISOString().split('T')[0]);
        }
        return range;
      };

      const next7DaysList = getNext7DaysRange();
      const seventhDayStr = next7DaysList[6];

      const getFull6WeeksGrid = (yearMonth) => {
        const [year, month] = yearMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const prevMonthLastDate = new Date(year, month - 1, 0).getDate();
        const currentMonthLastDate = new Date(year, month, 0).getDate();
        const days = [];

        for (let i = firstDayIndex - 1; i >= 0; i--) {
          const pDay = prevMonthLastDate - i;
          const pMonth = month - 1 === 0 ? 12 : month - 1;
          const pYear = month - 1 === 0 ? year - 1 : year;
          days.push({ dateStr: `${pYear}-${String(pMonth).padStart(2, '0')}-${String(pDay).padStart(2, '0')}`, dayNum: pDay, isCurrentMonth: false });
        }

        for (let d = 1; d <= currentMonthLastDate; d++) {
          days.push({ dateStr: `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`, dayNum: d, isCurrentMonth: true });
        }

        let nextDay = 1;
        while (days.length < 42) {
          const nMonth = month + 1 === 13 ? 1 : month + 1;
          const nYear = month + 1 === 13 ? year + 1 : year;
          days.push({ dateStr: `${nYear}-${String(nMonth).padStart(2, '0')}-${String(nextDay).padStart(2, '0')}`, dayNum: nextDay, isCurrentMonth: false });
          nextDay++;
        }
        return days;
      };

      const daySchedule = schedule
        .filter(item => item.date === selectedDate)
        .sort((a, b) => timeToMinutes(a.startTime || a.time) - timeToMinutes(b.startTime || b.time));

      const realTodayStr = getRealTodayString();
      const tomorrowLessons = schedule.filter(item => item.date === tomorrowStr);
      const day7Lessons = schedule.filter(item => item.date === day7Str);

      const monthlySchedule = schedule
        .filter(item => item.date.startsWith(selectedMonth))
        .sort((a, b) => new Date(a.date) - new Date(b.date) || timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

      let estimatedIncome = 0;
      let totalIncome = 0;
      let totalExpense = 0;

      monthlySchedule.forEach(item => {
        const totalFee = calculateTotalFee(item);
        estimatedIncome += totalFee;
        totalExpense += (Number(item.courtFee) || 0);

        if (item.date <= realTodayStr && item.enrolledStudents && item.enrolledStudents.length > 0) {
          const coach = Number(item.coachFee) || 0;
          const court = Number(item.courtFee) || 0;
          
          if (item.feeMode === 'per_person') {
            item.enrolledStudents.forEach(st => {
              if (st.isPaid) {
                const perPersonCourt = item.enrolledStudents.length > 0 ? court / item.enrolledStudents.length : 0;
                totalIncome += (coach + perPersonCourt);
              }
            });
          } else {
            const isAnyPaid = item.enrolledStudents.some(st => st.isPaid);
            if (isAnyPaid) {
              const paidCount = item.enrolledStudents.filter(st => st.isPaid).length;
              if (paidCount > 0) {
                totalIncome += totalFee;
              }
            }
          }
        }
      });

      const netProfit = totalIncome - totalExpense;

      const groupedCourtFees = monthlySchedule
        .filter(item => (Number(item.courtFee) || 0) > 0)
        .reduce((acc, item) => {
          let rawPayer = (item.courtPayer || '').trim();
          let payerKey = (!rawPayer || rawPayer === '待定' || rawPayer === '未定' || rawPayer === '未填寫') ? '待定' : rawPayer;
          
          if (!acc[payerKey]) {
            acc[payerKey] = { payerName: payerKey, total: 0, items: [] };
          }
          acc[payerKey].total += Number(item.courtFee) || 0;
          acc[payerKey].items.push(item);
          return acc;
        }, {});

      const sortedPayerGroups = Object.values(groupedCourtFees).sort((a, b) => {
        if (a.payerName === '待定') return 1;
        if (b.payerName === '待定') return -1;
        return a.payerName.localeCompare(b.payerName, 'zh-HK');
      });

      const handleCancelLesson = (lessonId) => {
        if (window.confirm("⚠ 確定要取消這堂課嗎？所有學員紀錄將會移除。")) {
          setSchedule(schedule.filter(s => s.id !== lessonId));
          if (selectedLessonModal && selectedLessonModal.id === lessonId) {
            setSelectedLessonModal(null);
          }
        }
      };

      const handleSaveLesson = (e) => {
        e.preventDefault();

        let finalCourtPayer = lessonForm.courtPayer;
        if (lessonForm.courtPayer === '__CUSTOM__') {
          const customPayer = lessonForm.customCourtPayer.trim();
          if (!customPayer) {
            alert('請輸入新墊支人姓名！');
            return;
          }
          finalCourtPayer = customPayer;
          if (!courtPayers.includes(customPayer)) {
            setCourtPayers([...courtPayers, customPayer]);
          }
        }

        if (lessonForm.id) {
          setSchedule(schedule.map(item => item.id === lessonForm.id ? {
            ...item,
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            feeMode: lessonForm.feeMode,
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            courtPayer: finalCourtPayer || '待定',
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court
          } : item));
          setShowEditModal(false);
          setSelectedLessonModal(null);
        } else {
          setSchedule([...schedule, {
            id: Date.now(),
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            feeMode: lessonForm.feeMode,
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            courtPayer: finalCourtPayer || '待定',
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court || '未定場地',
            enrolledStudents: []
          }]);
          setShowAddModal(false);
        }
      };

      const handleAddStudentToLesson = () => {
        if (!selectedLessonModal) return;
        
        let targetName = addStudentSelect;
        if (addStudentSelect === '__CUSTOM__') {
          targetName = addStudentCustom.trim();
          if (!targetName) { alert('請輸入新學員姓名！'); return; }
          if (!students.some(s => s.name === targetName)) {
            setStudents(prev => [...prev, { id: Date.now(), name: targetName, phone: '', level: '新手', notes: '透過課堂快速新增' }]);
          }
        }

        if (!targetName) { alert('請選擇或輸入學員姓名！'); return; }
        if (selectedLessonModal.enrolledStudents.some(s => s.name === targetName)) { alert('該學員已在名單中！'); return; }
        if (selectedLessonModal.enrolledStudents.length >= selectedLessonModal.maxCapacity) { alert('該課節人數已滿！'); return; }

        const updatedStudents = [...selectedLessonModal.enrolledStudents, { name: targetName, isPaid: false, payMethod: 'FPS' }];
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };

        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
        setAddStudentSelect('');
        setAddStudentCustom('');
      };

      const handleRemoveStudentFromLesson = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.filter(s => s.name !== studentName);
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleTogglePaidStatus = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, isPaid: !s.isPaid } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleUpdatePayMethod = (studentName, payMethod) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, payMethod } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleOpenStudentModalByName = (studentName) => {
        const found = students.find(s => s.name === studentName);
        if (found) {
          setSelectedStudentModal(found);
        } else {
          setSelectedStudentModal({ id: Date.now(), name: studentName, phone: '', level: '新手', notes: '未在學員名單中登記完整資料' });
        }
      };

      // 打開續堂設定彈窗
      const handleOpenRenewModal = (item) => {
        const currentDate = new Date(item.date);
        currentDate.setDate(currentDate.getDate() + 7);
        const nextDateStr = currentDate.toISOString().split('T')[0];

        setRenewForm({
          originalLesson: item,
          date: nextDateStr,
          startTime: item.startTime || item.time || '19:00',
          endTime: item.endTime || '21:00',
          court: item.court || '',
          courtPayer: item.courtPayer || 'TH Coach',
          keepStudents: true
        });
        setShowRenewModal(true);
      };

      // 執行續堂保存
      const handleConfirmRenewLesson = (e) => {
        e.preventDefault();
        const item = renewForm.originalLesson;
        if (!item) return;

        const updatedStudents = renewForm.keepStudents 
          ? item.enrolledStudents.map(s => ({ ...s, isPaid: false }))
          : [];

        const newLesson = {
          ...item,
          id: Date.now(),
          date: renewForm.date,
          startTime: renewForm.startTime,
          endTime: renewForm.endTime,
          court: renewForm.court,
          courtPayer: renewForm.courtPayer,
          enrolledStudents: updatedStudents
        };

        setSchedule([...schedule, newLesson]);
        setShowRenewModal(false);
        setSelectedLessonModal(null);
        alert(`🎉 成功續堂！已排定於 ${renewForm.date} (${renewForm.startTime}-${renewForm.endTime})`);
      };

      const addToAppleCalendar = (item) => {
        const dateStr = item.date.replace(/-/g, '');
        const startT = (item.startTime || '00:00').replace(':', '') + '00';
        const endT = (item.endTime || item.startTime || '00:00').replace(':', '') + '00';
        
        const startDT = `${dateStr}T${startT}`;
        const endDT = `${dateStr}T${endT}`;

        const studentListStr = item.enrolledStudents.map(s => s.name).join(', ') || '尚無學員';
        const totalFee = calculateTotalFee(item);

        const icsContent = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TH.badminton App//EN', 'BEGIN:VEVENT',
          `SUMMARY:🏸 ${item.courseName} (${item.enrolledStudents.length}/${item.maxCapacity}人)`,
          `DESCRIPTION:學員：${studentListStr}\\n計費模式：${item.feeMode === 'per_person' ? '每人學費' : '整堂學費'}\\n課堂費：HK$${item.coachFee}\\n場地費：HK$${item.courtFee}\\n預計總學費：HK$${totalFee}`,

                  <input placeholder="球場地點" value={lessonForm.court} onChange={e => setLessonForm({...lessonForm, court: e.target.value})} style={inputStyle} />

                  <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                    <button type="submit" style={{ flex: 1, padding: '10px', backgroundColor: '#e6b800', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold', cursor: 'pointer' }}>
                      保存變更
                    </button>
                    <button type="button" onClick={() => setShowEditModal(false)} style={{ padding: '10px', backgroundColor: '#8a949d', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>
                      取消
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: 課堂詳情 */}
          {selectedLessonModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: theme.modalBg, color: theme.textPrimary, padding: '18px', borderRadius: '12px', width: '100%', maxWidth: '400px', maxHeight: '90vh', overflowY: 'auto', border: `1px solid ${theme.border}` }}>
                
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', borderBottom: `1px solid ${theme.border}`, paddingBottom: '8px' }}>
                  <h3 style={{ margin: 0, fontSize: '16px', display: 'flex', alignItems: 'center', gap: '4px' }}>{icons.shuttlecock} {selectedLessonModal.courseName} 詳情</h3>
                  <button onClick={() => setSelectedLessonModal(null)} style={{ border: 'none', backgroundColor: 'transparent', color: theme.textPrimary, fontSize: '18px', cursor: 'pointer' }}>✖</button>
                </div>

                <div style={{ fontSize: '13px', color: theme.textSecondary, lineHeight: '1.6', marginBottom: '12px' }}>
                  <div>{icons.calendar} <strong>時間：</strong>{selectedLessonModal.date} {selectedLessonModal.startTime || selectedLessonModal.time}{selectedLessonModal.endTime ? ` - ${selectedLessonModal.endTime}` : ''}</div>
                  <div>{icons.location} <strong>地點：</strong>{selectedLessonModal.court}</div>
                  <div>{icons.money} <strong>計費模式：</strong>{selectedLessonModal.feeMode === 'per_person' ? '按每人收費' : '按整堂收費'}</div>
                  <div>{icons.money} <strong>課堂費：</strong>HK${selectedLessonModal.coachFee} /{selectedLessonModal.feeMode === 'per_person' ? '人' : '堂'}</div>
                  <div>🏟 <strong>場地費：</strong>HK${selectedLessonModal.courtFee} ({selectedLessonModal.courtPayer || '待定'})</div>
                  <div style={{ fontSize: '14px', fontWeight: 'bold', color: isDarkMode ? '#81c784' : '#2b580c', marginTop: '4px' }}>
                    💵 預計總學費：HK${calculateTotalFee(selectedLessonModal)}
                  </div>
                </div>

                <div style={{ backgroundColor: isDarkMode ? '#252525' : '#f8f9fa', padding: '10px', borderRadius: '8px', marginBottom: '12px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                    <h4 style={{ margin: 0, fontSize: '14px', color: theme.textPrimary }}>
                      👥 學員名單 ({selectedLessonModal.enrolledStudents.length} / {selectedLessonModal.maxCapacity}人)
                    </h4>
                    <span style={{ fontSize: '10px', color: theme.textMuted }}>💡 雙擊學員列可查看詳情</span>
                  </div>
                  
                  {selectedLessonModal.enrolledStudents.length === 0 ? (
                    <div style={{ fontSize: '12px', color: theme.textMuted, marginBottom: '8px' }}>尚無學員，請在下方新增。</div>
                  ) : (
                    selectedLessonModal.enrolledStudents.map((st, idx) => (
                      <div 
                        key={idx} 
                        onDoubleClick={() => handleOpenStudentModalByName(st.name)}
                        style={{ 
                          display: 'flex', flexDirection: 'column', gap: '4px',
                          backgroundColor: theme.cardBg, padding: '6px 8px', borderRadius: '6px', 
                          marginBottom: '6px', fontSize: '12px', border: `1px solid ${theme.border}`,
                          cursor: 'pointer', userSelect: 'none', color: theme.textPrimary
                        }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div>
                            <strong style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>{icons.user} {st.name}</strong>
                            <span style={{ marginLeft: '4px', fontSize: '11px', color: st.isPaid ? '#81c784' : '#e57373' }}>
                              ({st.isPaid ? '已付' : '未付'})
                            </span>
                          </div>
                          <div style={{ display: 'flex', gap: '4px' }}>
                            <button 
                              onClick={(e) => { e.stopPropagation(); handleTogglePaidStatus(st.name); }} 
                              style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: st.isPaid ? '#fabb6e' : '#4eac6d', color: '#fff', cursor: 'pointer' }}>
                              {st.isPaid ? '設未付' : '設已付'}
                            </button>
                            <button 
                              onClick={(e) => { e.stopPropagation(); handleRemoveStudentFromLesson(st.name); }} 
                              style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: '#e57373', color: '#fff', cursor: 'pointer' }}>
                              移除
                            </button>
                          </div>
                        </div>

                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '11px', color: theme.textSecondary }}>
                          <span>💳 收款方式:</span>
                          <select 
                            value={st.payMethod || 'FPS'} 
                            onClick={e => e.stopPropagation()}
                            onChange={e => handleUpdatePayMethod(st.name, e.target.value)} 
                            style={{ padding: '2px 4px', fontSize: '11px', borderRadius: '4px', border: `1px solid ${theme.inputBorder}`, backgroundColor: theme.inputBg, color: theme.inputText }}>
                            <option value="FPS" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>FPS (轉數快)</option>
                            <option value="PayMe" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>PayMe</option>
                            <option value="現金" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>現金</option>
                            <option value="銀行轉帳" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>銀行轉帳</option>
                          </select>
                        </div>
                      </div>
                    ))
                  )}

                  {selectedLessonModal.enrolledStudents.length < selectedLessonModal.maxCapacity ? (
                    <div style={{ marginTop: '10px', borderTop: `1px dashed ${theme.border}`, paddingTop: '8px' }}>
                      <div style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '4px', color: theme.textPrimary }}>➕ 加入學員至此班課：</div>
                      <select 
                        value={addStudentSelect} 
                        onChange={e => { 
                          setAddStudentSelect(e.target.value); 
                          if (e.target.value !== '__CUSTOM__') setAddStudentCustom(''); 
                        }} 
                        style={{ ...inputStyle, fontSize: '12px', padding: '6px', marginBottom: addStudentSelect === '__CUSTOM__' ? '6px' : '0' }}>
                        <option value="" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>-- 從已登記學員中選擇 --</option>
                        {students.map(s => <option key={s.id} value={s.name} style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>{s.name}</option>)}
                        <option value="__CUSTOM__" style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>➕ 輸入新學員...</option>
                      </select>

                      {addStudentSelect === '__CUSTOM__' && (
                        <input 
                          placeholder="請輸入新學員姓名..." 
                          value={addStudentCustom} 
                          onChange={e => setAddStudentCustom(e.target.value)} 
                          style={{ ...inputStyle, fontSize: '12px', padding: '6px', marginBottom: '6px' }} 
                          required
                        />
                      )}

                      <button 
                        onClick={handleAddStudentToLesson} 
                        style={{ width: '100%', padding: '6px', marginTop: '6px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                        加入此課堂
                      </button>
                    </div>
                  ) : (
                    <div style={{ fontSize: '12px', color: '#e57373', marginTop: '6px', textAlign: 'center' }}>⚠ 人數已滿（上限 {selectedLessonModal.maxCapacity} 人）</div>
                  )}
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <button 
                    onClick={() => handleOpenRenewModal(selectedLessonModal)} 
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px', padding: '8px', backgroundColor: '#fabb6e', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    {icons.refresh} 續堂 (可選時間)
                  </button>
                  <button 
                    onClick={() => {
                      setLessonForm({
                        id: selectedLessonModal.id,
                        courseTypeId: '1',
                        courseName: selectedLessonModal.courseName,
                        maxCapacity: selectedLessonModal.maxCapacity,
                        feeMode: selectedLessonModal.feeMode || 'per_person',
                        coachFee: selectedLessonModal.coachFee,
                        courtFee: selectedLessonModal.courtFee,
                        courtPayer: selectedLessonModal.courtPayer || '待定',
                        customCourtPayer: '',
                        date: selectedLessonModal.date,
                        startTime: selectedLessonModal.startTime || selectedLessonModal.time || '19:00',
                        endTime: selectedLessonModal.endTime || '21:00',
                        court: selectedLessonModal.court
                      });
                      setShowEditModal(true);
                    }} 
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px', padding: '8px', backgroundColor: isDarkMode ? '#333' : '#e0e0e0', color: theme.textPrimary, border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    {icons.edit} 修改
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL: 續堂選項 */}
          {showRenewModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2150, padding: '15px' }}>
              <div style={{ backgroundColor: theme.modalBg, color: theme.textPrimary, padding: '18px', borderRadius: '12px', width: '100%', maxWidth: '400px', maxHeight: '90vh', overflowY: 'auto', border: `1px solid ${theme.border}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', borderBottom: `1px solid ${theme.border}`, paddingBottom: '8px' }}>
                  <h3 style={{ margin: 0, fontSize: '16px', display: 'flex', alignItems: 'center', gap: '4px' }}>{icons.refresh} 續堂安排 ({renewForm.originalLesson?.courseName})</h3>
                  <button onClick={() => setShowRenewModal(false)} style={{ border: 'none', backgroundColor: 'transparent', color: theme.textPrimary, fontSize: '18px', cursor: 'pointer' }}>✖</button>
                </div>

                <form onSubmit={handleConfirmRenewLesson} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <div>
                    <label style={{ fontSize: '11px', color: theme.textSecondary, fontWeight: 'bold' }}>📅 續堂日期</label>
                    <input 
                      type="date" 
                      value={renewForm.date} 
                      onChange={e => setRenewForm({ ...renewForm, date: e.target.value })} 
                      required 
                      style={{ ...inputStyle, width: '100%', marginTop: '3px' }} 
                    />
                  </div>

                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: theme.textSecondary, fontWeight: 'bold' }}>⏰ 開始時間</label>
                      <input 
                        type="time" 
                        value={renewForm.startTime} 
                        onChange={e => setRenewForm({ ...renewForm, startTime: e.target.value })} 
                        required 
                        style={{ ...inputStyle, marginTop: '3px' }} 
                      />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: theme.textSecondary, fontWeight: 'bold' }}>⏰ 結束時間</label>
                      <input 
                        type="time" 
                        value={renewForm.endTime} 
                        onChange={e => setRenewForm({ ...renewForm, endTime: e.target.value })} 
                        required 
                        style={{ ...inputStyle, marginTop: '3px' }} 
                      />
                    </div>
                  </div>

                  <div>
                    <label style={{ fontSize: '11px', color: theme.textSecondary, fontWeight: 'bold' }}>📍 球場地點</label>
                    <input 
                      placeholder="球場地點" 
                      value={renewForm.court} 
                      onChange={e => setRenewForm({ ...renewForm, court: e.target.value })} 
                      style={{ ...inputStyle, marginTop: '3px' }} 
                    />
                  </div>

                  <div>
                    <label style={{ fontSize: '11px', color: theme.textSecondary, fontWeight: 'bold' }}>💳 場地費墊支人</label>
                    <select 
                      value={renewForm.courtPayer} 
                      onChange={e => setRenewForm({ ...renewForm, courtPayer: e.target.value })} 
                      style={{ ...inputStyle, paddingRight: '20px', marginTop: '3px' }}>
                      {courtPayers.map(p => (
                        <option key={p} value={p} style={{ backgroundColor: theme.cardBg, color: theme.textPrimary }}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div style={{ backgroundColor: isDarkMode ? '#252525' : '#f0f4f8', padding: '8px 10px', borderRadius: '6px', display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }} onClick={() => setRenewForm({ ...renewForm, keepStudents: !renewForm.keepStudents })}>
                    <input 
                      type="checkbox" 
                      checked={renewForm.keepStudents} 
                      onChange={e => setRenewForm({ ...renewForm, keepStudents: e.target.checked })} 
                      style={{ cursor: 'pointer' }}
                    />
                    <label style={{ fontSize: '12px', color: theme.textPrimary, cursor: 'pointer', userSelect: 'none' }}>
                      帶入原學員名單 (付款狀態將重置為「未付」)
                    </label>
                  </div>

                  <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                    <button type="submit" style={{ flex: 1, padding: '10px', backgroundColor: '#fabb6e', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold', fontSize: '14px', cursor: 'pointer' }}>
                      確認續堂
                    </button>
                    <button type="button" onClick={() => setShowRenewModal(false)} style={{ padding: '10px', backgroundColor: '#8a949d', color: '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>
                      取消
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 底部導覽列 */}
          <nav style={{ 
            position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: theme.cardBg, borderTop: `1px solid ${theme.border}`, 
            display: 'flex', justifyContent: 'space-around', paddingTop: '8px',
            paddingBottom: 'calc(8px + env(safe-area-inset-bottom, 12px))', zIndex: 1000, maxWidth: '480px', margin: '0 auto' 
          }}>
            <button onClick={() => setActiveTab('schedule')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'schedule' ? '#5b8bf7' : theme.textMuted, fontSize: '11px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' }}>
              {icons.calendar}
              <span>課表</span>
            </button>
            <button onClick={() => setActiveTab('revenue')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'revenue' ? '#5b8bf7' : theme.textMuted, fontSize: '11px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' }}>
              {icons.revenue}
              <span>收支</span>
            </button>
            <button onClick={() => setActiveTab('students')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'students' ? '#5b8bf7' : theme.textMuted, fontSize: '11px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' }}>
              {icons.user}
              <span>學員</span>
            </button>
            <button onClick={() => setActiveTab('settings')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'settings' ? '#5b8bf7' : theme.textMuted, fontSize: '11px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' }}>
              {icons.settings}
              <span>設定</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BadmintonCoachApp />);
  </script>
</body>
</html>
