<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TH.badminton</title>
  <!-- 載入 React 與 Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #f8f9fa;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BadmintonCoachApp() {
      const APP_VERSION = "v2.6.0";
      const LAST_UPDATED = "2026-09-30 02:45";

      // 取得今天的 YYYY-MM-DD 與 YYYY-MM
      const getTodayString = () => new Date().toISOString().split('T')[0];
      const getMonthString = (dateStr) => dateStr.substring(0, 7);

      const todayStr = getTodayString();
      const currentMonthStr = getMonthString(todayStr);

      // 1. 設定頁預設課程種類
      const [courseTypes, setCourseTypes] = useState(() => {
        const saved = localStorage.getItem('th_badminton_courseTypes');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: '1人私教', maxCapacity: 1, duration: '1小時', defaultCoachFee: 500, defaultCourtFee: 150 },
          { id: '2', name: '2-4人小班', maxCapacity: 4, duration: '2小時', defaultCoachFee: 800, defaultCourtFee: 200 },
          { id: '3', name: '5-8人中班', maxCapacity: 8, duration: '2小時', defaultCoachFee: 1200, defaultCourtFee: 240 },
          { id: '4', name: '8人以上大班', maxCapacity: 12, duration: '2小時', defaultCoachFee: 1500, defaultCourtFee: 300 },
        ];
      });

      const [editingCourseTypeId, setEditingCourseTypeId] = useState(null);

      // 學員列表（預設等級改為 新手/近初/初級/初中/中級）
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('th_badminton_students');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: '張小明', phone: '91234567', level: '近初', notes: '習慣右手，想練高遠球' },
          { id: 2, name: '李阿華', phone: '98765432', level: '初中', notes: '主力練雙打平抽' }
        ];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [studentForm, setStudentForm] = useState({ name: '', phone: '', level: '新手', notes: '' });
      const [editingStudentId, setEditingStudentId] = useState(null);

      // 課表資料
      const [schedule, setSchedule] = useState(() => {
        const saved = localStorage.getItem('th_badminton_schedule');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            courseName: '1人私教',
            maxCapacity: 1,
            coachFee: 500,
            courtFee: 150,
            date: todayStr,
            startTime: '19:00',
            endTime: '20:00',
            court: '中山紀念公園體育館',
            enrolledStudents: [{ name: '張小明', isPaid: false }]
          }
        ];
      });

      useEffect(() => { localStorage.setItem('th_badminton_courseTypes', JSON.stringify(courseTypes)); }, [courseTypes]);
      useEffect(() => { localStorage.setItem('th_badminton_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('th_badminton_schedule', JSON.stringify(schedule)); }, [schedule]);

      const [activeTab, setActiveTab] = useState('schedule');
      const [editingLessonId, setEditingLessonId] = useState(null);
      const [selectedLessonModal, setSelectedLessonModal] = useState(null);
      
      const [addStudentSelect, setAddStudentSelect] = useState('');
      const [addStudentCustom, setAddStudentCustom] = useState('');

      // 預設選擇今天與當前月份
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedMonth, setSelectedMonth] = useState(currentMonthStr);

      const [courseTypeForm, setCourseTypeForm] = useState({ name: '', maxCapacity: 4, duration: '2小時', defaultCoachFee: '', defaultCourtFee: '' });

      // 排課表單
      const [lessonForm, setLessonForm] = useState({
        courseTypeId: '1',
        courseName: '1人私教',
        maxCapacity: 1,
        coachFee: 500,
        courtFee: 150,
        date: todayStr,
        startTime: '19:00',
        endTime: '21:00',
        court: ''
      });

      // WhatsApp 導向工具
      const openWhatsApp = (phone, message = '') => {
        if (!phone) {
          alert('⚠️ 該學員未填寫電話號碼！');
          return;
        }
        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length === 8) cleanPhone = '852' + cleanPhone;
        const encodedMsg = encodeURIComponent(message);
        window.open(`https://wa.me/${cleanPhone}?text=${encodedMsg}`, '_blank');
      };

      // 計算 N 天後的日期字串
      const getDateOffsetStr = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().split('T')[0];
      };

      const day7Str = getDateOffsetStr(7);

      // 取得未來 6 天範圍陣列
      const getNext6DaysRange = () => {
        const range = [];
        const baseDate = new Date();
        for (let i = 1; i <= 6; i++) {
          const d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          range.push(d.toISOString().split('T')[0]);
        }
        return range;
      };

      const next6DaysList = getNext6DaysRange();
      const sixthDayStr = next6DaysList[5];

      // 月曆網格邏輯
      const getFull6WeeksGrid = (yearMonth) => {
        const [year, month] = yearMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const prevMonthLastDate = new Date(year, month - 1, 0).getDate();
        const currentMonthLastDate = new Date(year, month, 0).getDate();
        const days = [];

        for (let i = firstDayIndex - 1; i >= 0; i--) {
          const pDay = prevMonthLastDate - i;
          const pMonth = month - 1 === 0 ? 12 : month - 1;
          const pYear = month - 1 === 0 ? year - 1 : year;
          days.push({ dateStr: `${pYear}-${String(pMonth).padStart(2, '0')}-${String(pDay).padStart(2, '0')}`, dayNum: pDay, isCurrentMonth: false });
        }

        for (let d = 1; d <= currentMonthLastDate; d++) {
          days.push({ dateStr: `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`, dayNum: d, isCurrentMonth: true });
        }

        let nextDay = 1;
        while (days.length < 42) {
          const nMonth = month + 1 === 13 ? 1 : month + 1;
          const nYear = month + 1 === 13 ? year + 1 : year;
          days.push({ dateStr: `${nYear}-${String(nMonth).padStart(2, '0')}-${String(nextDay).padStart(2, '0')}`, dayNum: nextDay, isCurrentMonth: false });
          nextDay++;
        }
        return days;
      };

      const daySchedule = schedule.filter(item => item.date === selectedDate);

      // 提醒事項：今天課堂與 7 天後課堂
      const todayLessons = schedule.filter(item => item.date === todayStr);
      const day7Lessons = schedule.filter(item => item.date === day7Str);

      // 收入總額計算
      const monthlySchedule = schedule.filter(item => item.date.startsWith(selectedMonth));
      let totalRevenue = 0;
      let paidRevenue = 0;
      let unpaidRevenue = 0;

      monthlySchedule.forEach(item => {
        const totalFee = (Number(item.coachFee) || 0) + (Number(item.courtFee) || 0);
        totalRevenue += totalFee;
        const allPaid = item.enrolledStudents.length > 0 && item.enrolledStudents.every(s => s.isPaid);
        if (allPaid) paidRevenue += totalFee;
        else unpaidRevenue += totalFee;
      });

      // 取消排課
      const handleCancelLesson = (lessonId) => {
        if (window.confirm("⚠️ 確定要取消這堂課嗎？所有學員紀錄將會移除。")) {
          setSchedule(schedule.filter(s => s.id !== lessonId));
          if (selectedLessonModal && selectedLessonModal.id === lessonId) {
            setSelectedLessonModal(null);
          }
        }
      };

      // 保存排課
      const handleSaveLesson = (e) => {
        e.preventDefault();

        if (editingLessonId) {
          setSchedule(schedule.map(item => item.id === editingLessonId ? {
            ...item,
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court
          } : item));
          setEditingLessonId(null);
        } else {
          setSchedule([...schedule, {
            id: Date.now(),
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court || '未定場地',
            enrolledStudents: []
          }]);
        }
      };

      // 雙擊彈窗中加人
      const handleAddStudentToLesson = () => {
        if (!selectedLessonModal) return;
        const targetName = addStudentCustom.trim() || addStudentSelect;

        if (!targetName) { alert('請選擇或輸入學員姓名！'); return; }
        if (selectedLessonModal.enrolledStudents.some(s => s.name === targetName)) { alert('該學員已在名單中！'); return; }
        if (selectedLessonModal.enrolledStudents.length >= selectedLessonModal.maxCapacity) { alert('該課節人數已滿！'); return; }

        const updatedStudents = [...selectedLessonModal.enrolledStudents, { name: targetName, isPaid: false }];
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };

        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
        setAddStudentSelect('');
        setAddStudentCustom('');
      };

      const handleRemoveStudentFromLesson = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.filter(s => s.name !== studentName);
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleTogglePaidStatus = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, isPaid: !s.isPaid } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleRenewLesson = (item) => {
        const currentDate = new Date(item.date);
        currentDate.setDate(currentDate.getDate() + 7);
        const nextDateStr = currentDate.toISOString().split('T')[0];
        const resetStudents = item.enrolledStudents.map(s => ({ ...s, isPaid: false }));
        setSchedule([...schedule, { ...item, id: Date.now(), date: nextDateStr, enrolledStudents: resetStudents }]);
        alert(`成功續堂！下週課堂日期：${nextDateStr}`);
      };

      const addToAppleCalendar = (item) => {
        const dateStr = item.date.replace(/-/g, '');
        const startT = (item.startTime || '00:00').replace(':', '') + '00';
        const endT = (item.endTime || item.startTime || '00:00').replace(':', '') + '00';
        
        const startDT = `${dateStr}T${startT}`;
        const endDT = `${dateStr}T${endT}`;

        const studentListStr = item.enrolledStudents.map(s => s.name).join(', ') || '尚無學員';
        const totalFee = (item.coachFee || 0) + (item.courtFee || 0);

        const icsContent = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TH.badminton App//EN', 'BEGIN:VEVENT',
          `SUMMARY:🏸 ${item.courseName} (${item.enrolledStudents.length}/${item.maxCapacity}人)`,
          `DESCRIPTION:學員：${studentListStr}\\n課堂費：HK$${item.coachFee}\\n場地費：HK$${item.courtFee}\\n總學費：HK$${totalFee}`,
          `LOCATION:${item.court || '體育館'}`, `DTSTART:${startDT}`, `DTEND:${endDT}`, 'END:VEVENT', 'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `badminton_${item.date}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 學員管理
      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!studentForm.name) return;

        if (editingStudentId) {
          setStudents(students.map(s => s.id === editingStudentId ? { ...studentForm, id: editingStudentId } : s));
          setEditingStudentId(null);
        } else {
          setStudents([...students, { ...studentForm, id: Date.now() }]);
        }
        setStudentForm({ name: '', phone: '', level: '新手', notes: '' });
      };

      const handleStartEditStudent = (s) => {
        setEditingStudentId(s.id);
        setStudentForm({
          name: s.name || '',
          phone: s.phone || '',
          level: s.level || '新手',
          notes: s.notes || ''
        });
      };

      // 設定頁：新增與修改課程類別
      const handleSaveCourseType = (e) => {
        e.preventDefault();
        if (!courseTypeForm.name || !courseTypeForm.defaultCoachFee) return;

        if (editingCourseTypeId) {
          setCourseTypes(courseTypes.map(c => c.id === editingCourseTypeId ? {
            ...c,
            name: courseTypeForm.name,
            maxCapacity: Number(courseTypeForm.maxCapacity),
            defaultCoachFee: Number(courseTypeForm.defaultCoachFee),
            defaultCourtFee: Number(courseTypeForm.defaultCourtFee || 0)
          } : c));
          setEditingCourseTypeId(null);
        } else {
          setCourseTypes([...courseTypes, {
            id: String(Date.now()),
            name: courseTypeForm.name,
            maxCapacity: Number(courseTypeForm.maxCapacity),
            duration: '2小時',
            defaultCoachFee: Number(courseTypeForm.defaultCoachFee),
            defaultCourtFee: Number(courseTypeForm.defaultCourtFee || 0)
          }]);
        }
        setCourseTypeForm({ name: '', maxCapacity: 4, duration: '2小時', defaultCoachFee: '', defaultCourtFee: '' });
      };

      const exportBackupData = () => {
        const data = { courseTypes, students, schedule, exportDate: new Date().toLocaleString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `th_badminton_backup_${todayStr}.json`;
        a.click();
      };

      const importBackupData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (confirm('確定要還原備份嗎？這將會覆蓋現有資料！')) {
              if (imported.courseTypes) setCourseTypes(imported.courseTypes);
              if (imported.students) setStudents(imported.students);
              if (imported.schedule) setSchedule(imported.schedule);
              alert('🎉 資料成功還原！');
            }
          } catch (err) { alert('❌ 檔案格式錯誤！'); }
        };
        reader.readAsText(file);
      };

      const inputStyle = { width: '100%', padding: '6px 8px', borderRadius: '6px', border: '1px solid #ccc', boxSizing: 'border-box', fontSize: '13px', appearance: 'none', WebkitAppearance: 'none' };
      const cardStyle = { backgroundColor: '#fff', padding: '12px', borderRadius: '10px', marginBottom: '12px', boxSizing: 'border-box', width: '100%', boxShadow: '0 1px 3px rgba(0,0,0,0.05)' };
      const weekLabels = ['日', '一', '二', '三', '四', '五', '六'];

      return (
        <div style={{ 
          maxWidth: '480px', margin: '0 auto', paddingTop: '15px', paddingLeft: '15px', paddingRight: '15px',
          paddingBottom: 'calc(100px + env(safe-area-inset-bottom, 20px))', 
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', backgroundColor: '#f8f9fa', minHeight: '100vh', boxSizing: 'border-box' 
        }}>
          <header style={{ textAlign: 'center', marginBottom: '15px' }}>
            <h1 style={{ fontSize: '20px', margin: '0', color: '#1a1a1a', fontWeight: 'bold' }}>🏸 TH.badminton</h1>
          </header>

          {/* TAB 1: 課表 */}
          {activeTab === 'schedule' && (
            <div>

              {/* 🔔 今日與預訂提醒通知區塊 */}
              <div style={{ ...cardStyle, borderLeft: '5px solid #ff9800', backgroundColor: '#fffde7' }}>
                <div style={{ fontWeight: 'bold', fontSize: '14px', color: '#e65100', marginBottom: '6px', display: 'flex', justifyContent: 'space-between' }}>
                  <span>🔔 今日與 7 天後課堂提醒</span>
                  <span style={{ fontSize: '11px', color: '#888' }}>{todayStr}</span>
                </div>

                {/* 今日課節提醒 */}
                <div style={{ fontSize: '12px', color: '#333', marginBottom: '8px' }}>
                  <strong>📍 今日上課通知 ({todayLessons.length} 堂)：</strong>
                  {todayLessons.length === 0 ? (
                    <div style={{ color: '#777', marginTop: '2px' }}>今天沒有排課</div>
                  ) : (
                    todayLessons.map(item => (
                      <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px', padding: '4px 6px', backgroundColor: '#fff', borderRadius: '4px', border: '1px solid #ffe082' }}>
                        <span>🏸 {item.courseName} ({item.startTime})</span>
                        <button 
                          onClick={() => {
                            if (item.enrolledStudents.length === 0) { alert('該課堂尚未有學員'); return; }
                            const firstSt = item.enrolledStudents[0];
                            const match = students.find(s => s.name === firstSt.name);
                            openWhatsApp(match ? match.phone : '', `你好 ${firstSt.name}，提醒你今天 ${item.startTime} 在【${item.court || '體育館'}】有羽毛球課堂，請準時出席！🏸`);
                          }}
                          style={{ padding: '2px 6px', backgroundColor: '#25D366', color: '#fff', border: 'none', borderRadius: '4px', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}>
                          💬 提醒今日上課
                        </button>
                      </div>
                    ))
                  )}
                </div>

                {/* 7 天後課節提醒 (Book 場提醒) */}
                <div style={{ fontSize: '12px', color: '#333' }}>
                  <strong>📆 7 天後課堂 / Book 場提醒 ({day7Str})：</strong>
                  {day7Lessons.length === 0 ? (
                    <div style={{ color: '#777', marginTop: '2px' }}>7天後 ({day7Str}) 無安排課堂</div>
                  ) : (
                    day7Lessons.map(item => (
                      <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px', padding: '4px 6px', backgroundColor: '#fff', borderRadius: '4px', border: '1px solid #ffe082' }}>
                        <span>🏸 {item.courseName} ({item.startTime})</span>
                        <button 
                          onClick={() => {
                            if (item.enrolledStudents.length === 0) { alert('該課堂尚未有學員'); return; }
                            const firstSt = item.enrolledStudents[0];
                            const match = students.find(s => s.name === firstSt.name);
                            openWhatsApp(match ? match.phone : '', `你好 ${firstSt.name}，關於下週 ${day7Str} ${item.startTime} 的羽毛球課堂，我將會幫你預訂場地/確認安排！🏸`);
                          }}
                          style={{ padding: '2px 6px', backgroundColor: '#0088cc', color: '#fff', border: 'none', borderRadius: '4px', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}>
                          💬 提醒預訂/確認
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* 排課/修改表單 */}
              <div style={{ ...cardStyle, border: editingLessonId ? '2px solid #e6c260' : '1px solid #eee' }}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '15px' }}>{editingLessonId ? '✏️ 修改/改期課堂' : '➕ 新增預約課堂'}</h3>
                <form onSubmit={handleSaveLesson} style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  
                  {/* 選擇預設課程分類 */}
                  <div>
                    <label style={{ fontSize: '11px', color: '#666' }}>選擇預設課程</label>
                    <select 
                      value={lessonForm.courseTypeId} 
                      onChange={e => {
                        const selected = courseTypes.find(c => c.id === e.target.value);
                        if (selected) {
                          setLessonForm({ 
                            ...lessonForm, 
                            courseTypeId: selected.id,
                            courseName: selected.name,
                            maxCapacity: selected.maxCapacity,
                            coachFee: selected.defaultCoachFee,
                            courtFee: selected.defaultCourtFee
                          });
                        }
                      }} 
                      style={{ ...inputStyle, paddingRight: '20px' }}>
                      {courseTypes.map(c => (
                        <option key={c.id} value={c.id}>
                          {c.name} (上限{c.maxCapacity}人 - 課堂費${c.defaultCoachFee} + 場地費${c.defaultCourtFee})
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* 課程名稱與人數上限 */}
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1.5 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>課程名稱</label>
                      <input type="text" value={lessonForm.courseName} onChange={e => setLessonForm({...lessonForm, courseName: e.target.value})} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>人數上限</label>
                      <input type="number" min="1" value={lessonForm.maxCapacity} onChange={e => setLessonForm({...lessonForm, maxCapacity: e.target.value})} style={inputStyle} required />
                    </div>
                  </div>

                  {/* 課堂費 + 場地費 */}
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>課堂費 (HK$)</label>
                      <input type="number" value={lessonForm.coachFee} onChange={e => setLessonForm({...lessonForm, coachFee: e.target.value})} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>場地費 (HK$)</label>

                  <div>🏟️ <strong>場地費：</strong>HK${selectedLessonModal.courtFee}</div>
                  <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#2b580c', marginTop: '4px' }}>
                    💵 課堂總學費：HK${(Number(selectedLessonModal.coachFee) || 0) + (Number(selectedLessonModal.courtFee) || 0)}
                  </div>
                </div>

                {/* 學員管理區 */}
                <div style={{ backgroundColor: '#f8f9fa', padding: '10px', borderRadius: '8px', marginBottom: '12px' }}>
                  <h4 style={{ margin: '0 0 8px 0', fontSize: '14px' }}>
                    👥 學員名單 ({selectedLessonModal.enrolledStudents.length} / {selectedLessonModal.maxCapacity}人)
                  </h4>
                  
                  {selectedLessonModal.enrolledStudents.length === 0 ? (
                    <div style={{ fontSize: '12px', color: '#888', marginBottom: '8px' }}>尚無學員，請在下方新增。</div>
                  ) : (
                    selectedLessonModal.enrolledStudents.map((st, idx) => {
                      const matchedStudent = students.find(s => s.name === st.name);
                      const phone = matchedStudent ? matchedStudent.phone : '';

                      return (
                        <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: '#fff', padding: '6px 8px', borderRadius: '6px', marginBottom: '6px', fontSize: '12px', border: '1px solid #eee' }}>
                          <div>
                            <strong>{st.name}</strong>
                            <span style={{ marginLeft: '4px', fontSize: '11px', color: st.isPaid ? '#2e7d32' : '#c62828' }}>
                              ({st.isPaid ? '已付' : '未付'})
                            </span>
                          </div>
                          <div style={{ display: 'flex', gap: '4px' }}>
                            <button 
                              onClick={() => {
                                const msg = `你好 ${st.name}，關於預約在 ${selectedLessonModal.date} ${selectedLessonModal.startTime || selectedLessonModal.time} 的【${selectedLessonModal.courseName}】羽毛球課堂：`;
                                openWhatsApp(phone, msg);
                              }} 
                              style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: '#25D366', color: '#fff', fontWeight: 'bold', cursor: 'pointer' }}>
                              💬 WA
                            </button>
                            <button 
                              onClick={() => handleTogglePaidStatus(st.name)} 
                              style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: st.isPaid ? '#fabb6e' : '#4eac6d', color: '#fff', cursor: 'pointer' }}>
                              {st.isPaid ? '設為未付' : '設為已付'}
                            </button>
                            <button 
                              onClick={() => handleRemoveStudentFromLesson(st.name)} 
                              style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: '#e57373', color: '#fff', cursor: 'pointer' }}>
                              移除
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}

                  {/* 新增學員介面 */}
                  {selectedLessonModal.enrolledStudents.length < selectedLessonModal.maxCapacity ? (
                    <div style={{ marginTop: '10px', borderTop: '1px dashed #ccc', paddingTop: '8px' }}>
                      <div style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '4px' }}>➕ 加入學員至此班課：</div>
                      <select 
                        value={addStudentSelect} 
                        onChange={e => { setAddStudentSelect(e.target.value); setAddStudentCustom(''); }} 
                        style={{ ...inputStyle, fontSize: '12px', padding: '6px', marginBottom: '6px' }}>
                        <option value="">-- 從已登記學員中選擇 --</option>
                        {students.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                      </select>

                      <input 
                        placeholder="或輸入新學員姓名..." 
                        value={addStudentCustom} 
                        onChange={e => { setAddStudentCustom(e.target.value); setAddStudentSelect(''); }} 
                        style={{ ...inputStyle, fontSize: '12px', padding: '6px', marginBottom: '6px' }} 
                      />

                      <button 
                        onClick={handleAddStudentToLesson} 
                        style={{ width: '100%', padding: '6px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                        加入此課堂
                      </button>
                    </div>
                  ) : (
                    <div style={{ fontSize: '12px', color: '#e57373', marginTop: '6px', textAlign: 'center' }}>⚠️ 人數已滿（上限 {selectedLessonModal.maxCapacity} 人）</div>
                  )}
                </div>

                {/* 課堂進階操作 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <button 
                    onClick={() => { handleRenewLesson(selectedLessonModal); setSelectedLessonModal(null); }} 
                    style={{ padding: '8px', backgroundColor: '#fabb6e', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    🔄 下週續堂
                  </button>
                  <button 
                    onClick={() => {
                      setEditingLessonId(selectedLessonModal.id);
                      setLessonForm({
                        courseTypeId: '1',
                        courseName: selectedLessonModal.courseName,
                        maxCapacity: selectedLessonModal.maxCapacity,
                        coachFee: selectedLessonModal.coachFee,
                        courtFee: selectedLessonModal.courtFee,
                        date: selectedLessonModal.date,
                        startTime: selectedLessonModal.startTime || selectedLessonModal.time || '19:00',
                        endTime: selectedLessonModal.endTime || '21:00',
                        court: selectedLessonModal.court
                      });
                      setSelectedLessonModal(null);
                    }} 
                    style={{ padding: '8px', backgroundColor: '#e0e0e0', color: '#333', border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    ✏️ 修改 / 改期課堂資料
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* 底部導覽列 */}
          <nav style={{ 
            position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: '#ffffff', borderTop: '1px solid #e0e0e0', 
            display: 'flex', justifyContent: 'space-around', paddingTop: '8px',
            paddingBottom: 'calc(8px + env(safe-area-inset-bottom, 12px))', zIndex: 1000, maxWidth: '480px', margin: '0 auto' 
          }}>
            <button onClick={() => setActiveTab('schedule')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'schedule' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>📅<br/>課表</button>
            <button onClick={() => setActiveTab('revenue')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'revenue' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>💰<br/>收入</button>
            <button onClick={() => setActiveTab('students')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'students' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>👤<br/>學員</button>
            <button onClick={() => setActiveTab('settings')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'settings' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>⚙️<br/>設定</button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BadmintonCoachApp />);
  </script>
</body>
</html>
