<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TH.badminton</title>
  <!-- 載入 React 與 Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #f8f9fa;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BadmintonCoachApp() {
      const APP_VERSION = "v3.6.0";
      const LAST_UPDATED = "2026-10-02 12:00";

      const getRealTodayString = () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const getMonthString = (dateStr) => dateStr.substring(0, 7);

      const [todayStr, setTodayStr] = useState(getRealTodayString());
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedMonth, setSelectedMonth] = useState(getMonthString(todayStr));

      // 隱藏/顯示金額狀態（預設隱藏）
      const [showAmount, setShowAmount] = useState(false);

      useEffect(() => {
        const interval = setInterval(() => {
          const currentRealToday = getRealTodayString();
          if (currentRealToday !== todayStr) {
            setTodayStr(currentRealToday);
          }
        }, 60000);
        return () => clearInterval(interval);
      }, [todayStr]);

      // 1. 預設課程種類
      const [courseTypes, setCourseTypes] = useState(() => {
        const saved = localStorage.getItem('th_badminton_courseTypes');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: '1人私教', maxCapacity: 1, duration: '1小時', feeMode: 'per_lesson', defaultCoachFee: 500, defaultCourtFee: 150 },
          { id: '2', name: '2-4人小班', maxCapacity: 4, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 200, defaultCourtFee: 200 },
          { id: '3', name: '5-8人中班', maxCapacity: 8, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 150, defaultCourtFee: 240 },
          { id: '4', name: '8人以上大班', maxCapacity: 12, duration: '2小時', feeMode: 'per_person', defaultCoachFee: 120, defaultCourtFee: 300 },
        ];
      });

      const [editingCourseTypeId, setEditingCourseTypeId] = useState(null);

      // 2. 學員列表
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('th_badminton_students');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: '張小明', phone: '91234567', level: '近初', notes: '習慣右手，想練高遠球' },
          { id: 2, name: '李阿華', phone: '98765432', level: '初中', notes: '主力練雙打平抽' }
        ];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [studentForm, setStudentForm] = useState({ id: null, name: '', phone: '', level: '新手', notes: '' });

      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [showEditStudentModal, setShowEditStudentModal] = useState(false);
      const [selectedStudentModal, setSelectedStudentModal] = useState(null);

      // 3. 課表資料
      const [schedule, setSchedule] = useState(() => {
        const saved = localStorage.getItem('th_badminton_schedule');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            courseName: '1人私教',
            maxCapacity: 1,
            feeMode: 'per_lesson',
            coachFee: 500,
            courtFee: 150,
            date: todayStr,
            startTime: '19:00',
            endTime: '20:00',
            court: '中山紀念公園體育館',
            enrolledStudents: [{ name: '張小明', isPaid: false, payMethod: 'FPS' }]
          }
        ];
      });

      // 4. 手動收支紀錄 (支出人、收款方式等)
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('th_badminton_transactions');
        return saved ? JSON.parse(saved) : [
          { id: 101, type: 'expense', title: '中山體育館預訂場地費', amount: 150, date: todayStr, payer: 'TH Coach', category: '場地費用' },
          { id: 102, type: 'income', title: '張小明 1人私教課堂費', amount: 500, date: todayStr, payMethod: 'FPS', category: '課堂費用' }
        ];
      });

      // 收支新增 Form 狀態
      const [showAddTransModal, setShowAddTransModal] = useState(false);
      const [transForm, setTransForm] = useState({
        type: 'expense',
        title: '',
        amount: '',
        date: todayStr,
        payer: 'TH Coach',
        payMethod: 'FPS',
        category: '場地費用'
      });

      useEffect(() => { localStorage.setItem('th_badminton_courseTypes', JSON.stringify(courseTypes)); }, [courseTypes]);
      useEffect(() => { localStorage.setItem('th_badminton_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('th_badminton_schedule', JSON.stringify(schedule)); }, [schedule]);
      useEffect(() => { localStorage.setItem('th_badminton_transactions', JSON.stringify(transactions)); }, [transactions]);

      const [activeTab, setActiveTab] = useState('schedule');
      
      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [selectedLessonModal, setSelectedLessonModal] = useState(null);

      const [addStudentSelect, setAddStudentSelect] = useState('');
      const [addStudentCustom, setAddStudentCustom] = useState('');

      const [courseTypeForm, setCourseTypeForm] = useState({ name: '', maxCapacity: 4, feeMode: 'per_person', defaultCoachFee: '', defaultCourtFee: '' });

      const [lessonForm, setLessonForm] = useState({
        id: null,
        courseTypeId: '1',
        courseName: '1人私教',
        maxCapacity: 1,
        feeMode: 'per_lesson',
        coachFee: 500,
        courtFee: 150,
        date: todayStr,
        startTime: '19:00',
        endTime: '21:00',
        court: ''
      });

      const getStudentCompletedLessonCount = (studentName) => {
        return schedule.filter(lesson => 
          lesson.date <= todayStr && 
          lesson.enrolledStudents && 
          lesson.enrolledStudents.some(s => s.name === studentName)
        ).length;
      };

      const timeToMinutes = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
      };

      const isLessonOverlapped = (currentLesson, dayLessons) => {
        const startA = timeToMinutes(currentLesson.startTime || currentLesson.time);
        const endA = timeToMinutes(currentLesson.endTime) || (startA + 60);

        return dayLessons.some(other => {
          if (other.id === currentLesson.id) return false;
          const startB = timeToMinutes(other.startTime || other.time);
          const endB = timeToMinutes(other.endTime) || (startB + 60);

          return startA < endB && startB < endA;
        });
      };

      const handleOpenAddModal = () => {
        const defaultType = courseTypes[0] || { id: '1', name: '1人私教', maxCapacity: 1, feeMode: 'per_lesson', defaultCoachFee: 500, defaultCourtFee: 150 };
        setLessonForm({
          id: null,
          courseTypeId: defaultType.id,
          courseName: defaultType.name,
          maxCapacity: defaultType.maxCapacity,
          feeMode: defaultType.feeMode || 'per_person',
          coachFee: defaultType.defaultCoachFee,
          courtFee: defaultType.defaultCourtFee,
          date: selectedDate,
          startTime: '19:00',
          endTime: '21:00',
          court: ''
        });
        setShowAddModal(true);
      };

      const calculateTotalFee = (item, customStudentCount = null) => {
        const coach = Number(item.coachFee) || 0;
        const court = Number(item.courtFee) || 0;
        const count = customStudentCount !== null 
          ? customStudentCount 
          : (item.enrolledStudents ? item.enrolledStudents.length : 0);

        if (item.feeMode === 'per_person') {
          return (coach * count) + court;
        } else {
          return coach + court;
        }
      };

      const openWhatsApp = (phone) => {
        if (!phone) {
          alert('⚠️ 該學員未填寫電話號碼！');
          return;
        }
        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length === 8) cleanPhone = '852' + cleanPhone;
        window.open(`https://wa.me/${cleanPhone}`, '_blank');
      };

      const getDateOffsetStr = (offsetDays) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().split('T')[0];
      };

      const day7Str = getDateOffsetStr(7);

      const getNext6DaysRange = () => {
        const range = [];
        const baseDate = new Date();
        for (let i = 1; i <= 6; i++) {
          const d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          range.push(d.toISOString().split('T')[0]);
        }
        return range;
      };

      const next6DaysList = getNext6DaysRange();
      const sixthDayStr = next6DaysList[5];

      const getFull6WeeksGrid = (yearMonth) => {
        const [year, month] = yearMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const prevMonthLastDate = new Date(year, month - 1, 0).getDate();
        const currentMonthLastDate = new Date(year, month, 0).getDate();
        const days = [];

        for (let i = firstDayIndex - 1; i >= 0; i--) {
          const pDay = prevMonthLastDate - i;
          const pMonth = month - 1 === 0 ? 12 : month - 1;
          const pYear = month - 1 === 0 ? year - 1 : year;
          days.push({ dateStr: `${pYear}-${String(pMonth).padStart(2, '0')}-${String(pDay).padStart(2, '0')}`, dayNum: pDay, isCurrentMonth: false });
        }

        for (let d = 1; d <= currentMonthLastDate; d++) {
          days.push({ dateStr: `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`, dayNum: d, isCurrentMonth: true });
        }

        let nextDay = 1;
        while (days.length < 42) {
          const nMonth = month + 1 === 13 ? 1 : month + 1;
          const nYear = month + 1 === 13 ? year + 1 : year;
          days.push({ dateStr: `${nYear}-${String(nMonth).padStart(2, '0')}-${String(nextDay).padStart(2, '0')}`, dayNum: nextDay, isCurrentMonth: false });
          nextDay++;
        }
        return days;
      };

      const daySchedule = schedule
        .filter(item => item.date === selectedDate)
        .sort((a, b) => timeToMinutes(a.startTime || a.time) - timeToMinutes(b.startTime || b.time));

      const todayLessons = schedule.filter(item => item.date === todayStr);
      const day7Lessons = schedule.filter(item => item.date === day7Str);

      // 收支統計運算
      const monthlySchedule = schedule
        .filter(item => item.date.startsWith(selectedMonth))
        .sort((a, b) => new Date(a.date) - new Date(b.date) || timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

      const monthlyTransactions = transactions
        .filter(item => item.date.startsWith(selectedMonth))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      let totalIncome = 0;
      let totalExpense = 0;

      // 自動加總課堂收支與手動收支
      monthlySchedule.forEach(item => {
        const totalFee = calculateTotalFee(item);
        totalIncome += totalFee;
        totalExpense += (Number(item.courtFee) || 0);
      });

      monthlyTransactions.forEach(t => {
        if (t.type === 'income') totalIncome += Number(t.amount);
        if (t.type === 'expense') totalExpense += Number(t.amount);
      });

      const netProfit = totalIncome - totalExpense;

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!transForm.title || !transForm.amount) return;
        setTransactions([
          {
            id: Date.now(),
            ...transForm,
            amount: Number(transForm.amount)
          },
          ...transactions
        ]);
        setShowAddTransModal(false);
        setTransForm({ type: 'expense', title: '', amount: '', date: todayStr, payer: 'TH Coach', payMethod: 'FPS', category: '場地費用' });
      };

      const handleDeleteTransaction = (id) => {
        if (confirm('確定刪除此筆收支紀錄？')) {
          setTransactions(transactions.filter(t => t.id !== id));
        }
      };

      const handleCancelLesson = (lessonId) => {
        if (window.confirm("⚠️ 確定要取消這堂課嗎？所有學員紀錄將會移除。")) {
          setSchedule(schedule.filter(s => s.id !== lessonId));
          if (selectedLessonModal && selectedLessonModal.id === lessonId) {
            setSelectedLessonModal(null);
          }
        }
      };

      const handleSaveLesson = (e) => {
        e.preventDefault();

        if (lessonForm.id) {
          setSchedule(schedule.map(item => item.id === lessonForm.id ? {
            ...item,
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            feeMode: lessonForm.feeMode,
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court
          } : item));
          setShowEditModal(false);
          setSelectedLessonModal(null);
        } else {
          setSchedule([...schedule, {
            id: Date.now(),
            courseName: lessonForm.courseName,
            maxCapacity: Number(lessonForm.maxCapacity),
            feeMode: lessonForm.feeMode,
            coachFee: Number(lessonForm.coachFee),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            startTime: lessonForm.startTime,
            endTime: lessonForm.endTime,
            court: lessonForm.court || '未定場地',
            enrolledStudents: []
          }]);
          setShowAddModal(false);
        }
      };

      const handleAddStudentToLesson = () => {
        if (!selectedLessonModal) return;
        const targetName = addStudentCustom.trim() || addStudentSelect;

        if (!targetName) { alert('請選擇或輸入學員姓名！'); return; }
        if (selectedLessonModal.enrolledStudents.some(s => s.name === targetName)) { alert('該學員已在名單中！'); return; }
        if (selectedLessonModal.enrolledStudents.length >= selectedLessonModal.maxCapacity) { alert('該課節人數已滿！'); return; }

        const updatedStudents = [...selectedLessonModal.enrolledStudents, { name: targetName, isPaid: false, payMethod: 'FPS' }];
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };

        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
        setAddStudentSelect('');
        setAddStudentCustom('');
      };

      const handleRemoveStudentFromLesson = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.filter(s => s.name !== studentName);
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleTogglePaidStatus = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, isPaid: !s.isPaid } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleUpdatePayMethod = (studentName, payMethod) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, payMethod } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      const handleOpenStudentModalByName = (studentName) => {
        const found = students.find(s => s.name === studentName);
        if (found) {
          setSelectedStudentModal(found);
        } else {
          setSelectedStudentModal({ id: Date.now(), name: studentName, phone: '', level: '新手', notes: '未在學員名單中登記完整資料' });
        }
      };

      const handleRenewLesson = (item) => {
        const currentDate = new Date(item.date);
        currentDate.setDate(currentDate.getDate() + 7);
        const nextDateStr = currentDate.toISOString().split('T')[0];
        const resetStudents = item.enrolledStudents.map(s => ({ ...s, isPaid: false }));
        setSchedule([...schedule, { ...item, id: Date.now(), date: nextDateStr, enrolledStudents: resetStudents }]);
        alert(`成功續堂！下週課堂日期：${nextDateStr}`);
      };

      const addToAppleCalendar = (item) => {
        const dateStr = item.date.replace(/-/g, '');
        const startT = (item.startTime || '00:00').replace(':', '') + '00';
        const endT = (item.endTime || item.startTime || '00:00').replace(':', '') + '00';
        
        const startDT = `${dateStr}T${startT}`;
        const endDT = `${dateStr}T${endT}`;

        const studentListStr = item.enrolledStudents.map(s => s.name).join(', ') || '尚無學員';
        const totalFee = calculateTotalFee(item);

        const icsContent = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TH.badminton App//EN', 'BEGIN:VEVENT',
          `SUMMARY:🏸 ${item.courseName} (${item.enrolledStudents.length}/${item.maxCapacity}人)`,
          `DESCRIPTION:學員：${studentListStr}\\n計費模式：${item.feeMode === 'per_person' ? '每人學費' : '整堂學費'}\\n課堂費：HK$${item.coachFee}\\n場地費：HK$${item.courtFee}\\n預計總學費：HK$${totalFee}`,
          `LOCATION:${item.court || '體育館'}`, `DTSTART:${startDT}`, `DTEND:${endDT}`, 'END:VEVENT', 'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `badminton_${item.date}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!studentForm.name) return;

        if (studentForm.id) {
          setStudents(students.map(s => s.id === studentForm.id ? { ...studentForm } : s));
          setShowEditStudentModal(false);
          setSelectedStudentModal(studentForm);
        } else {
          setStudents([...students, { ...studentForm, id: Date.now() }]);
          setShowAddStudentModal(false);
        }
        setStudentForm({ id: null, name: '', phone: '', level: '新手', notes: '' });
      };

      const handleDeleteStudent = (studentId, studentName) => {
        if (window.confirm(`⚠️ 確定要刪除學員「${studentName}」嗎？此操作無法撤銷。`)) {
          setStudents(students.filter(s => s.id !== studentId));
          setSelectedStudentModal(null);
        }
      };

      const handleSaveCourseType = (e) => {
        e.preventDefault();
        if (!courseTypeForm.name || !courseTypeForm.defaultCoachFee) return;

        if (editingCourseTypeId) {
          setCourseTypes(courseTypes.map(c => c.id === editingCourseTypeId ? {
            ...c,
            name: courseTypeForm.name,
            maxCapacity: Number(courseTypeForm.maxCapacity),
            feeMode: courseTypeForm.feeMode,
            defaultCoachFee: Number(courseTypeForm.defaultCoachFee),
            defaultCourtFee: Number(courseTypeForm.defaultCourtFee || 0)
          } : c));
          setEditingCourseTypeId(null);
        } else {
          setCourseTypes([...courseTypes, {
            id: String(Date.now()),
            name: courseTypeForm.name,
            maxCapacity: Number(courseTypeForm.maxCapacity),
            feeMode: courseTypeForm.feeMode,
            duration: '2小時',
            defaultCoachFee: Number(courseTypeForm.defaultCoachFee),
            defaultCourtFee: Number(courseTypeForm.defaultCourtFee || 0)
          }]);
        }
        setCourseTypeForm({ name: '', maxCapacity: 4, feeMode: 'per_person', defaultCoachFee: '', defaultCourtFee: '' });
      };

      const exportBackupData = () => {
        const data = { courseTypes, students, schedule, transactions, exportDate: new Date().toLocaleString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `th_badminton_backup_${todayStr}.json`;
        a.click();
      };

      const importBackupData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (confirm('確定要還原備份嗎？這將會覆蓋現有資料！')) {
              if (imported.courseTypes) setCourseTypes(imported.courseTypes);
              if (imported.students) setStudents(imported.students);
              if (imported.schedule) setSchedule(imported.schedule);
              if (imported.transactions) setTransactions(imported.transactions);
              alert('🎉 資料成功還原！');
            }
          } catch (err) { alert('❌ 檔案格式錯誤！'); }
        };
        reader.readAsText(file);
      };

      const sortedStudents = [...students].sort((a, b) => a.name.localeCompare(b.name, 'zh-HK'));

      const inputStyle = { width: '100%', padding: '6px 8px', borderRadius: '6px', border: '1px solid #ccc', boxSizing: 'border-box', fontSize: '13px', appearance: 'none', WebkitAppearance: 'none' };
      const cardStyle = { backgroundColor: '#fff', padding: '12px', borderRadius: '10px', marginBottom: '12px', boxSizing: 'border-box', width: '100%', boxShadow: '0 1px 3px rgba(0,0,0,0.05)' };
      const weekLabels = ['日', '一', '二', '三', '四', '五', '六'];

      // 格式化顯示金額（預設隱藏）
      const formatAmount = (num) => showAmount ? `$${num}` : '****';

      return (
        <div style={{ 
          maxWidth: '480px', margin: '0 auto', paddingTop: '15px', paddingLeft: '15px', paddingRight: '15px',
          paddingBottom: 'calc(100px + env(safe-area-inset-bottom, 20px))', 
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', backgroundColor: '#f8f9fa', minHeight: '100vh', boxSizing: 'border-box' 
        }}>
          <header style={{ textAlign: 'center', marginBottom: '15px' }}>
            <h1 style={{ fontSize: '20px', margin: '0', color: '#1a1a1a', fontWeight: 'bold' }}>🏸 TH.badminton</h1>
          </header>

          {/* TAB 1: 課表 */}
          {activeTab === 'schedule' && (
            <div>
              <div style={{ ...cardStyle, borderLeft: '5px solid #ff9800', backgroundColor: '#fffde7' }}>
                <div style={{ fontWeight: 'bold', fontSize: '14px', color: '#e65100', marginBottom: '6px', display: 'flex', justifyContent: 'space-between' }}>
                  <span>🔔 課堂提醒</span>
                  <span style={{ fontSize: '11px', color: '#888' }}>{todayStr}</span>
                </div>

                <div style={{ fontSize: '12px', color: '#333', marginBottom: '8px' }}>
                  <strong>📍 今日上課通知 ({todayLessons.length} 堂)：</strong>

            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', borderRadius: '12px', padding: '15px', width: '100%', maxWidth: '400px', maxHeight: '90vh', overflowY: 'auto' }}>
                <h3 style={{ margin: '0 0 12px 0', fontSize: '16px' }}>{showEditModal ? '✏️ 編輯課堂資料' : '➕ 新增課堂預約'}</h3>
                <form onSubmit={handleSaveLesson} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <div>
                    <label style={{ fontSize: '12px', color: '#666' }}>課程類型</label>
                    <select 
                      value={lessonForm.courseTypeId} 
                      onChange={e => {
                        const selected = courseTypes.find(c => c.id === e.target.value);
                        if (selected) {
                          setLessonForm({
                            ...lessonForm,
                            courseTypeId: selected.id,
                            courseName: selected.name,
                            maxCapacity: selected.maxCapacity,
                            feeMode: selected.feeMode || 'per_person',
                            coachFee: selected.defaultCoachFee,
                            courtFee: selected.defaultCourtFee
                          });
                        }
                      }} 
                      style={inputStyle}>
                      {courseTypes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>

                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>日期</label>
                      <input type="date" value={lessonForm.date} onChange={e => setLessonForm({ ...lessonForm, date: e.target.value })} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>人數上限</label>
                      <input type="number" value={lessonForm.maxCapacity} onChange={e => setLessonForm({ ...lessonForm, maxCapacity: e.target.value })} style={inputStyle} required />
                    </div>
                  </div>

                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>開始時間</label>
                      <input type="time" value={lessonForm.startTime} onChange={e => setLessonForm({ ...lessonForm, startTime: e.target.value })} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>結束時間</label>
                      <input type="time" value={lessonForm.endTime} onChange={e => setLessonForm({ ...lessonForm, endTime: e.target.value })} style={inputStyle} required />
                    </div>
                  </div>

                  <div>
                    <label style={{ fontSize: '12px', color: '#666' }}>場地名稱</label>
                    <input type="text" placeholder="例如: 中山紀念公園體育館" value={lessonForm.court} onChange={e => setLessonForm({ ...lessonForm, court: e.target.value })} style={inputStyle} />
                  </div>

                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>教練費 ($)</label>
                      <input type="number" value={lessonForm.coachFee} onChange={e => setLessonForm({ ...lessonForm, coachFee: e.target.value })} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '12px', color: '#666' }}>場地費 ($)</label>
                      <input type="number" value={lessonForm.courtFee} onChange={e => setLessonForm({ ...lessonForm, courtFee: e.target.value })} style={inputStyle} />
                    </div>
                  </div>

                  <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                    <button type="button" onClick={() => { setShowAddModal(false); setShowEditModal(false); }} style={{ flex: 1, padding: '8px', backgroundColor: '#eee', border: 'none', borderRadius: '6px' }}>取消</button>
                    <button type="submit" style={{ flex: 1, padding: '8px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold' }}>儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 2. 管理特定課堂 (加人、繳費、刪除) MODAL */}
          {selectedLessonModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', borderRadius: '12px', padding: '15px', width: '100%', maxWidth: '420px', maxHeight: '90vh', overflowY: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 style={{ margin: 0, fontSize: '16px' }}>🏸 管理課堂：{selectedLessonModal.courseName}</h3>
                  <button onClick={() => setSelectedLessonModal(null)} style={{ border: 'none', background: 'none', fontSize: '18px', cursor: 'pointer' }}>❌</button>
                </div>

                <div style={{ fontSize: '12px', color: '#666', backgroundColor: '#f8f9fa', padding: '8px', borderRadius: '6px', marginBottom: '12px' }}>
                  📅 日期：{selectedLessonModal.date} ({selectedLessonModal.startTime} - {selectedLessonModal.endTime})<br />
                  📍 場地：{selectedLessonModal.court || '未定場地'}
                </div>

                {/* 新增學員至此課堂 */}
                <div style={{ marginBottom: '15px', padding: '10px', backgroundColor: '#eef2fe', borderRadius: '8px' }}>
                  <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#333', marginBottom: '6px' }}>➕ 新增學員至此課堂</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                    <select value={addStudentSelect} onChange={e => { setAddStudentSelect(e.target.value); setAddStudentCustom(''); }} style={inputStyle}>
                      <option value="">-- 從既有學員名單選擇 --</option>
                      {students.map(s => <option key={s.id} value={s.name}>{s.name} ({s.phone})</option>)}
                    </select>
                    <input type="text" placeholder="或直接輸入新學員姓名..." value={addStudentCustom} onChange={e => { setAddStudentCustom(e.target.value); setAddStudentSelect(''); }} style={inputStyle} />
                    <button onClick={handleAddStudentToLesson} style={{ padding: '6px', backgroundColor: '#4eac6d', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>加入學員</button>
                  </div>
                </div>

                {/* 名單與繳費狀態 */}
                <div style={{ fontSize: '13px', fontWeight: 'bold', marginBottom: '6px' }}>
                  名單 ({selectedLessonModal.enrolledStudents.length} / {selectedLessonModal.maxCapacity} 人)：
                </div>

                {selectedLessonModal.enrolledStudents.length === 0 ? (
                  <div style={{ color: '#aaa', fontSize: '12px', textAlign: 'center', padding: '10px' }}>尚無報名學員</div>
                ) : (
                  selectedLessonModal.enrolledStudents.map((st, idx) => (
                    <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: '1px solid #eee' }}>
                      <div>
                        <span style={{ fontWeight: 'bold', fontSize: '13px' }}>{st.name}</span>
                        <select 
                          value={st.payMethod || 'FPS'} 
                          onChange={e => handleUpdatePayMethod(st.name, e.target.value)}
                          style={{ marginLeft: '6px', fontSize: '11px', padding: '2px' }}>
                          <option value="FPS">FPS</option>
                          <option value="Cash">現金</option>
                          <option value="PayMe">PayMe</option>
                          <option value="Bank">轉帳</option>
                        </select>
                      </div>

                      <div style={{ display: 'flex', gap: '4px' }}>
                        <button 
                          onClick={() => handleTogglePaidStatus(st.name)}
                          style={{ padding: '3px 8px', fontSize: '11px', borderRadius: '4px', border: 'none', cursor: 'pointer', backgroundColor: st.isPaid ? '#e8f5e9' : '#fff3e0', color: st.isPaid ? '#2e7d32' : '#e65100', fontWeight: 'bold' }}>
                          {st.isPaid ? '已繳費' : '未繳費'}
                        </button>
                        <button 
                          onClick={() => handleRemoveStudentFromLesson(st.name)}
                          style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: '1px solid #ffcdd2', backgroundColor: '#ffebee', color: '#c62828', cursor: 'pointer' }}>
                          移除
                        </button>
                      </div>
                    </div>
                  ))
                )}

                <div style={{ display: 'flex', gap: '8px', marginTop: '15px' }}>
                  <button 
                    onClick={() => {
                      setLessonForm({
                        id: selectedLessonModal.id,
                        courseTypeId: selectedLessonModal.courseTypeId || '1',
                        courseName: selectedLessonModal.courseName,
                        maxCapacity: selectedLessonModal.maxCapacity,
                        feeMode: selectedLessonModal.feeMode || 'per_person',
                        coachFee: selectedLessonModal.coachFee,
                        courtFee: selectedLessonModal.courtFee,
                        date: selectedLessonModal.date,
                        startTime: selectedLessonModal.startTime,
                        endTime: selectedLessonModal.endTime,
                        court: selectedLessonModal.court
                      });
                      setShowEditModal(true);
                    }}
                    style={{ flex: 1, padding: '8px', backgroundColor: '#f0f0f0', border: '1px solid #ccc', borderRadius: '6px', fontSize: '12px' }}>
                    ✏️ 編輯課堂設定
                  </button>
                  <button 
                    onClick={() => handleCancelLesson(selectedLessonModal.id)}
                    style={{ padding: '8px 12px', backgroundColor: '#ffebee', color: '#c62828', border: '1px solid #ffcdd2', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold' }}>
                    🗑️ 取消課堂
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3. 新增 / 編輯學員 MODAL (已優化多行備註) */}
          {(showAddStudentModal || showEditStudentModal) && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', borderRadius: '12px', padding: '15px', width: '100%', maxWidth: '360px' }}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '16px' }}>{showEditStudentModal ? '✏️ 編輯學員資料' : '➕ 新增學員'}</h3>
                <form onSubmit={handleSaveStudent} style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <input type="text" placeholder="學員姓名" value={studentForm.name} onChange={e => setStudentForm({ ...studentForm, name: e.target.value })} style={inputStyle} required />
                  <input type="tel" placeholder="電話號碼 (如: 91234567)" value={studentForm.phone} onChange={e => setStudentForm({ ...studentForm, phone: e.target.value })} style={inputStyle} />
                  
                  <select value={studentForm.level} onChange={e => setStudentForm({ ...studentForm, level: e.target.value })} style={inputStyle}>
                    <option value="新手">新手</option>
                    <option value="近初">近初</option>
                    <option value="初級">初級</option>
                    <option value="初中">初中</option>
                    <option value="中級">中級</option>
                    <option value="高級">高級</option>
                  </select>

                  {/* 多行文字區塊 textarea 升級 */}
                  <div>
                    <label style={{ fontSize: '11px', color: '#666', marginBottom: '2px', display: 'block' }}>詳細備註 / 技術習慣：</label>
                    <textarea 
                      placeholder="填寫學習進度、習慣、習慣手等..." 
                      value={studentForm.notes} 
                      onChange={e => setStudentForm({ ...studentForm, notes: e.target.value })} 
                      style={{ ...inputStyle, height: '80px', resize: 'vertical' }} 
                    />
                  </div>

                  <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                    <button type="button" onClick={() => { setShowAddStudentModal(false); setShowEditStudentModal(false); }} style={{ flex: 1, padding: '8px', backgroundColor: '#eee', border: 'none', borderRadius: '6px' }}>取消</button>
                    <button type="submit" style={{ flex: 1, padding: '8px', backgroundColor: '#4eac6d', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold' }}>儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. 檢視學員詳細資料 MODAL */}
          {selectedStudentModal && !showEditStudentModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', borderRadius: '12px', padding: '15px', width: '100%', maxWidth: '360px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 style={{ margin: 0, fontSize: '16px' }}>👤 學員詳情</h3>
                  <button onClick={() => setSelectedStudentModal(null)} style={{ border: 'none', background: 'none', fontSize: '18px', cursor: 'pointer' }}>❌</button>
                </div>

                <div style={{ fontSize: '13px', lineHeight: '1.8', color: '#333' }}>
                  <div><strong>姓名：</strong>{selectedStudentModal.name}</div>
                  <div><strong>電話：</strong>{selectedStudentModal.phone || '未填寫'}</div>
                  <div><strong>程度：</strong>{selectedStudentModal.level}</div>
                  <div><strong>已完成課堂：</strong>{getStudentCompletedLessonCount(selectedStudentModal.name)} 堂</div>
                  
                  {/* 多行備註檢視 */}
                  <div style={{ marginTop: '6px', backgroundColor: '#f8f9fa', padding: '8px', borderRadius: '6px', border: '1px solid #eee', whiteSpace: 'pre-wrap' }}>
                    <strong>備註：</strong><br />
                    {selectedStudentModal.notes || '無備註'}
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '6px', marginTop: '15px' }}>
                  <button 
                    onClick={() => openWhatsApp(selectedStudentModal.phone)}
                    style={{ flex: 1, padding: '8px', backgroundColor: '#25D366', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                    💬 WhatsApp
                  </button>
                  <button 
                    onClick={() => { setStudentForm(selectedStudentModal); setShowEditStudentModal(true); }}
                    style={{ flex: 1, padding: '8px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                    ✏️ 編輯
                  </button>
                  <button 
                    onClick={() => handleDeleteStudent(selectedStudentModal.id, selectedStudentModal.name)}
                    style={{ padding: '8px', backgroundColor: '#ffebee', color: '#c62828', border: '1px solid #ffcdd2', borderRadius: '6px', fontSize: '12px', cursor: 'pointer' }}>
                    🗑️
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 5. 新增手動收支 MODAL */}
          {showAddTransModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', borderRadius: '12px', padding: '15px', width: '100%', maxWidth: '360px' }}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '16px' }}>➕ 新增手動收支紀錄</h3>
                <form onSubmit={handleSaveTransaction} style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <select value={transForm.type} onChange={e => setTransForm({ ...transForm, type: e.target.value })} style={inputStyle}>
                    <option value="expense">支出 (-)</option>
                    <option value="income">收入 (+)</option>
                  </select>

                  <input type="text" placeholder="項目說明 (如: 買羽毛球)" value={transForm.title} onChange={e => setTransForm({ ...transForm, title: e.target.value })} style={inputStyle} required />
                  <input type="number" placeholder="金額 ($)" value={transForm.amount} onChange={e => setTransForm({ ...transForm, amount: e.target.value })} style={inputStyle} required />
                  <input type="date" value={transForm.date} onChange={e => setTransForm({ ...transForm, date: e.target.value })} style={inputStyle} required />

                  {transForm.type === 'expense' ? (
                    <input type="text" placeholder="支出人 (預設: TH Coach)" value={transForm.payer} onChange={e => setTransForm({ ...transForm, payer: e.target.value })} style={inputStyle} />
                  ) : (
                    <select value={transForm.payMethod} onChange={e => setTransForm({ ...transForm, payMethod: e.target.value })} style={inputStyle}>
                      <option value="FPS">FPS</option>
                      <option value="Cash">現金</option>
                      <option value="PayMe">PayMe</option>
                      <option value="Bank">銀行轉帳</option>
                    </select>
                  )}

                  <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                    <button type="button" onClick={() => setShowAddTransModal(false)} style={{ flex: 1, padding: '8px', backgroundColor: '#eee', border: 'none', borderRadius: '6px' }}>取消</button>
                    <button type="submit" style={{ flex: 1, padding: '8px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold' }}>儲存紀錄</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BadmintonCoachApp />);
  </script>
</body>
</html>
