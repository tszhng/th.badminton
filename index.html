<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TH.badminton</title>
  <!-- 載入 React 與 Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #f8f9fa;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BadmintonCoachApp() {
      const APP_VERSION = "v1.5.0";
      const LAST_UPDATED = "2026-09-29 17:35";

      const todayStr = new Date().toISOString().split('T')[0];
      const currentMonthStr = todayStr.substring(0, 7);

      // 1. 課程預設分類 (私人1對1, 2-4人小班, 5-8人中班, 8人以上大班)
      const [courseTypes, setCourseTypes] = useState(() => {
        const saved = localStorage.getItem('th_badminton_courseTypes');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: '私人 1對1', maxCapacity: 1, duration: '1小時', defaultPrice: 500 },
          { id: '2', name: '2-4人 小班', maxCapacity: 4, duration: '2小時', defaultPrice: 250 },
          { id: '3', name: '5-8人 中班', maxCapacity: 8, duration: '2小時', defaultPrice: 180 },
          { id: '4', name: '8人以上 大班', maxCapacity: 12, duration: '2小時', defaultPrice: 120 },
        ];
      });

      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('th_badminton_students');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: '張小明', phone: '91234567', level: '初級', preferredDay: '星期一', preferredTime: '19:00 - 21:00', notes: '習慣右手' },
          { id: 2, name: '李阿華', phone: '98765432', level: '中級', preferredDay: '星期六', preferredTime: '10:00 - 12:00', notes: '練雙打平抽' }
        ];
      });

      // 2. 課堂資料架構 (支援場地費、多學員列表、各學員獨立繳費狀態)
      const [schedule, setSchedule] = useState(() => {
        const saved = localStorage.getItem('th_badminton_schedule');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            courseName: '私人 1對1',
            maxCapacity: 1,
            duration: '1小時',
            pricePerStudent: 500,
            courtFee: 150,
            date: todayStr,
            time: '19:00',
            court: '中山紀念公園體育館',
            enrolledStudents: [{ name: '張小明', isPaid: false }]
          },
          {
            id: 2,
            courseName: '2-4人 小班',
            maxCapacity: 4,
            duration: '2小時',
            pricePerStudent: 250,
            courtFee: 200,
            date: todayStr,
            time: '10:00',
            court: '九龍灣體育館',
            enrolledStudents: [{ name: '李阿華', isPaid: true }]
          }
        ];
      });

      useEffect(() => { localStorage.setItem('th_badminton_courseTypes', JSON.stringify(courseTypes)); }, [courseTypes]);
      useEffect(() => { localStorage.setItem('th_badminton_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('th_badminton_schedule', JSON.stringify(schedule)); }, [schedule]);

      const [activeTab, setActiveTab] = useState('schedule');
      const [editingLessonId, setEditingLessonId] = useState(null);
      const [selectedLessonModal, setSelectedLessonModal] = useState(null);
      const [newStudentForLesson, setNewStudentForLesson] = useState('');

      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [selectedMonth, setSelectedMonth] = useState(currentMonthStr);
      const [revenueFilter, setRevenueFilter] = useState('all');

      const [searchQuery, setSearchQuery] = useState('');
      const [newStudent, setNewStudent] = useState({ name: '', phone: '', level: '初級', preferredDay: '星期一', preferredTime: '', notes: '' });
      const [editingStudentId, setEditingStudentId] = useState(null);

      const [newCourseType, setNewCourseType] = useState({ name: '', maxCapacity: 4, duration: '2小時', defaultPrice: '' });

      // 表單狀態（新增排課容許初始沒有學員）
      const [lessonForm, setLessonForm] = useState({
        courseTypeId: '1',
        initialStudentName: '',
        pricePerStudent: 500,
        courtFee: 150,
        date: todayStr,
        time: '19:00',
        court: ''
      });

      // 月曆產生器
      const getFull6WeeksGrid = (yearMonth) => {
        const [year, month] = yearMonth.split('-').map(Number);
        const firstDayIndex = new Date(year, month - 1, 1).getDay();
        const prevMonthLastDate = new Date(year, month - 1, 0).getDate();
        const currentMonthLastDate = new Date(year, month, 0).getDate();
        const days = [];

        for (let i = firstDayIndex - 1; i >= 0; i--) {
          const pDay = prevMonthLastDate - i;
          const pMonth = month - 1 === 0 ? 12 : month - 1;
          const pYear = month - 1 === 0 ? year - 1 : year;
          days.push({ dateStr: `${pYear}-${String(pMonth).padStart(2, '0')}-${String(pDay).padStart(2, '0')}`, dayNum: pDay, isCurrentMonth: false });
        }

        for (let d = 1; d <= currentMonthLastDate; d++) {
          days.push({ dateStr: `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`, dayNum: d, isCurrentMonth: true });
        }

        let nextDay = 1;
        while (days.length < 42) {
          const nMonth = month + 1 === 13 ? 1 : month + 1;
          const nYear = month + 1 === 13 ? year + 1 : year;
          days.push({ dateStr: `${nYear}-${String(nMonth).padStart(2, '0')}-${String(nextDay).padStart(2, '0')}`, dayNum: nextDay, isCurrentMonth: false });
          nextDay++;
        }
        return days;
      };

      const getNext6DaysRange = () => {
        const range = [];
        const baseDate = new Date();
        for (let i = 1; i <= 6; i++) {
          const d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          range.push(d.toISOString().split('T')[0]);
        }
        return range;
      };

      const next6DaysList = getNext6DaysRange();
      const daySchedule = schedule.filter(item => item.date === selectedDate);

      // 計算收入（含場地費轉嫁後的預計應收金額）
      const monthlySchedule = schedule.filter(item => item.date.startsWith(selectedMonth));
      
      let totalRevenue = 0;
      let paidRevenue = 0;
      let unpaidRevenue = 0;

      monthlySchedule.forEach(item => {
        const count = item.enrolledStudents.length || 1;
        const courtFeePerPerson = (item.courtFee || 0) / count;
        item.enrolledStudents.forEach(st => {
          const fee = (item.pricePerStudent || 0) + courtFeePerPerson;
          totalRevenue += fee;
          if (st.isPaid) paidRevenue += fee;
          else unpaidRevenue += fee;
        });
      });

      // 取消排課（二次確認）
      const handleCancelLesson = (lessonId) => {
        if (window.confirm("⚠️ 確定要取消此堂課的排課嗎？取消後無法復原。")) {
          setSchedule(schedule.filter(s => s.id !== lessonId));
          if (selectedLessonModal && selectedLessonModal.id === lessonId) {
            setSelectedLessonModal(null);
          }
        }
      };

      // 儲存/預約課程
      const handleSaveLesson = (e) => {
        e.preventDefault();
        const selectedType = courseTypes.find(c => c.id === lessonForm.courseTypeId) || courseTypes[0];
        
        const initialStudents = lessonForm.initialStudentName 
          ? [{ name: lessonForm.initialStudentName, isPaid: false }]
          : [];

        if (editingLessonId) {
          setSchedule(schedule.map(item => item.id === editingLessonId ? {
            ...item,
            courseName: selectedType.name,
            maxCapacity: selectedType.maxCapacity,
            duration: selectedType.duration,
            pricePerStudent: Number(lessonForm.pricePerStudent),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            time: lessonForm.time,
            court: lessonForm.court
          } : item));
          setEditingLessonId(null);
        } else {
          setSchedule([...schedule, {
            id: Date.now(),
            courseName: selectedType.name,
            maxCapacity: selectedType.maxCapacity,
            duration: selectedType.duration,
            pricePerStudent: Number(lessonForm.pricePerStudent),
            courtFee: Number(lessonForm.courtFee),
            date: lessonForm.date,
            time: lessonForm.time,
            court: lessonForm.court || '未定場地',
            enrolledStudents: initialStudents
          }]);
        }
        setLessonForm({ ...lessonForm, initialStudentName: '' });
      };

      // 雙擊開啟的彈窗內：新增學員
      const handleAddStudentToLesson = () => {
        if (!newStudentForLesson || !selectedLessonModal) return;
        if (selectedLessonModal.enrolledStudents.some(s => s.name === newStudentForLesson)) {
          alert('該學員已在名單中！');
          return;
        }
        if (selectedLessonModal.enrolledStudents.length >= selectedLessonModal.maxCapacity) {
          alert('該課節人數已達上限！');
          return;
        }

        const updatedStudents = [...selectedLessonModal.enrolledStudents, { name: newStudentForLesson, isPaid: false }];
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };

        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
        setNewStudentForLesson('');
      };

      // 雙擊開啟的彈窗內：刪除學員
      const handleRemoveStudentFromLesson = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.filter(s => s.name !== studentName);
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      // 雙擊開啟的彈窗內：切換繳費狀態
      const handleTogglePaidStatus = (studentName) => {
        if (!selectedLessonModal) return;
        const updatedStudents = selectedLessonModal.enrolledStudents.map(s => 
          s.name === studentName ? { ...s, isPaid: !s.isPaid } : s
        );
        const updatedLesson = { ...selectedLessonModal, enrolledStudents: updatedStudents };
        setSchedule(schedule.map(s => s.id === updatedLesson.id ? updatedLesson : s));
        setSelectedLessonModal(updatedLesson);
      };

      // 續堂
      const handleRenewLesson = (item) => {
        const currentDate = new Date(item.date);
        currentDate.setDate(currentDate.getDate() + 7);
        const nextDateStr = currentDate.toISOString().split('T')[0];
        
        // 續堂重設繳費狀態
        const resetStudents = item.enrolledStudents.map(s => ({ ...s, isPaid: false }));
        
        setSchedule([...schedule, { ...item, id: Date.now(), date: nextDateStr, enrolledStudents: resetStudents }]);
        alert(`成功續堂！下週課堂日期：${nextDateStr}`);
      };

      // 加入 Apple/Google Calendar (.ics)
      const addToAppleCalendar = (item) => {
        const dateStr = item.date.replace(/-/g, '');
        const timeStr = item.time.replace(':', '') + '00';
        const startDT = `${dateStr}T${timeStr}`;
        let hours = (parseInt(item.time.split(':')[0], 10) + (item.duration.includes('2') ? 2 : 1)) % 24;
        const endDT = `${dateStr}T${hours < 10 ? '0' + hours : hours}${item.time.split(':')[1]}00`;

        const studentListStr = item.enrolledStudents.map(s => s.name).join(', ') || '尚無學員';

        const icsContent = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TH.badminton App//EN', 'BEGIN:VEVENT',
          `SUMMARY:🏸 羽毛球課 - ${item.courseName} (${item.enrolledStudents.length}/${item.maxCapacity}人)`,
          `DESCRIPTION:學員：${studentListStr}\\n課程：${item.courseName}\\n場地費：HK$${item.courtFee}`,
          `LOCATION:${item.court || '體育館'}`, `DTSTART:${startDT}`, `DTEND:${endDT}`, 'END:VEVENT', 'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `badminton_${item.date}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 學員管理
      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!newStudent.name) return;
        if (editingStudentId) {
          setStudents(students.map(s => s.id === editingStudentId ? { ...newStudent, id: editingStudentId } : s));
          setEditingStudentId(null);
        } else {
          setStudents([...students, { ...newStudent, id: Date.now() }]);
        }
        setNewStudent({ name: '', phone: '', level: '初級', preferredDay: '星期一', preferredTime: '', notes: '' });
      };

      const openWhatsApp = (phone, msg) => {
        if (!phone) { alert('該學員尚未填寫電話號碼！'); return; }
        const cleanPhone = phone.replace(/\D/g, '');
        const formattedPhone = cleanPhone.length === 8 ? `852${cleanPhone}` : cleanPhone;
        window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg || '你好！')}`, '_blank');
      };

      // 備份與還原
      const exportBackupData = () => {
        const data = { courseTypes, students, schedule, exportDate: new Date().toLocaleString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `th_badminton_backup_${todayStr}.json`;
        a.click();
      };

      const importBackupData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (confirm('確定要還原備份嗎？這將會覆蓋現有資料！')) {
              if (imported.courseTypes) setCourseTypes(imported.courseTypes);
              if (imported.students) setStudents(imported.students);
              if (imported.schedule) setSchedule(imported.schedule);
              alert('🎉 資料成功還原！');
            }
          } catch (err) {
            alert('❌ 檔案格式錯誤！');
          }
        };
        reader.readAsText(file);
      };

      const inputStyle = { width: '100%', padding: '8px 10px', borderRadius: '6px', border: '1px solid #ccc', boxSizing: 'border-box', fontSize: '14px' };
      const cardStyle = { backgroundColor: '#fff', padding: '12px', borderRadius: '10px', marginBottom: '12px', boxSizing: 'border-box', width: '100%', boxShadow: '0 1px 3px rgba(0,0,0,0.05)' };
      const weekLabels = ['日', '一', '二', '三', '四', '五', '六'];

      return (
        <div style={{ 
          maxWidth: '480px', margin: '0 auto', paddingTop: '15px', paddingLeft: '15px', paddingRight: '15px',
          paddingBottom: 'calc(100px + env(safe-area-inset-bottom, 20px))', 
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', backgroundColor: '#f8f9fa', minHeight: '100vh', boxSizing: 'border-box' 
        }}>
          <header style={{ textAlign: 'center', marginBottom: '15px' }}>
            <h1 style={{ fontSize: '20px', margin: '0', color: '#1a1a1a', fontWeight: 'bold' }}>🏸 TH.badminton</h1>
          </header>

          {/* TAB 1: 課表 */}
          {activeTab === 'schedule' && (
            <div>
              <div style={{ ...cardStyle, border: editingLessonId ? '2px solid #e6c260' : '1px solid #eee' }}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '15px' }}>{editingLessonId ? '✏️ 修改/改期課堂' : '➕ 新增預約課堂'}</h3>
                <form onSubmit={handleSaveLesson} style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  
                  {/* 課程分類 */}
                  <select 
                    value={lessonForm.courseTypeId} 
                    onChange={e => {
                      const selected = courseTypes.find(c => c.id === e.target.value);
                      setLessonForm({ 
                        ...lessonForm, 
                        courseTypeId: e.target.value, 
                        pricePerStudent: selected ? selected.defaultPrice : 0 
                      });
                    }} 
                    style={inputStyle}>
                    {courseTypes.map(c => <option key={c.id} value={c.id}>{c.name} (上限{c.maxCapacity}人, {c.duration})</option>)}
                  </select>

                  {/* 選擇首位學員（可選） */}
                  <select value={lessonForm.initialStudentName} onChange={e => setLessonForm({...lessonForm, initialStudentName: e.target.value})} style={inputStyle}>
                    <option value="">-- 加入學員 (可留空，日後再加入) --</option>
                    {students.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                  </select>

                  {/* 每人學費 + 總場地費 */}
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>每人學費 (HK$)</label>
                      <input type="number" value={lessonForm.pricePerStudent} onChange={e => setLessonForm({...lessonForm, pricePerStudent: e.target.value})} style={inputStyle} required />
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ fontSize: '11px', color: '#666' }}>總場地費 (學員平攤)</label>
                      <input type="number" placeholder="場地費" value={lessonForm.courtFee} onChange={e => setLessonForm({...lessonForm, courtFee: e.target.value})} style={inputStyle} required />
                    </div>
                  </div>

                  {/* 日期與時間 */}
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <input type="date" value={lessonForm.date} onChange={e => {
                      setLessonForm({...lessonForm, date: e.target.value});
                      setSelectedDate(e.target.value);
                      setSelectedMonth(e.target.value.substring(0, 7));
                    }} required style={{ ...inputStyle, flex: 1 }} />
                    <input type="time" value={lessonForm.time} onChange={e => setLessonForm({...lessonForm, time: e.target.value})} style={{ ...inputStyle, flex: 1 }} />
                  </div>

                  <input placeholder="球場地點 (例: 九龍灣體育館)" value={lessonForm.court} onChange={e => setLessonForm({...lessonForm, court: e.target.value})} style={inputStyle} />

                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button type="submit" style={{ flex: 1, padding: '10px', backgroundColor: editingLessonId ? '#e6b800' : '#4eac6d', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold' }}>
                      {editingLessonId ? '保存變更' : '確認預約'}
                    </button>
                    {editingLessonId && (
                      <button type="button" onClick={() => setEditingLessonId(null)} style={{ padding: '10px', backgroundColor: '#8a949d', color: '#fff', border: 'none', borderRadius: '6px' }}>取消</button>
                    )}
                  </div>
                </form>
              </div>

              {/* 日曆模組 */}
              <div style={{ ...cardStyle, padding: '10px' }}>
                <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', marginBottom: '8px' }}>
                  <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} style={{ padding: '4px 8px', fontSize: '13px', borderRadius: '6px', border: '1px solid #ccc' }} />
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', textAlign: 'center', fontSize: '12px', fontWeight: 'bold', color: '#777', marginBottom: '6px' }}>
                  {weekLabels.map((w, idx) => <div key={idx}>{w}</div>)}
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px', textAlign: 'center' }}>
                  {getFull6WeeksGrid(selectedMonth).map(({ dateStr, dayNum, isCurrentMonth }) => {
                    const hasLesson = schedule.some(s => s.date === dateStr);
                    const isSelected = dateStr === selectedDate;
                    const isNext6Days = next6DaysList.includes(dateStr);

                    let bgColor = '#f0f0f0';
                    let textColor = isCurrentMonth ? '#333' : '#bbb';

                    if (isNext6Days) { bgColor = '#ffebee'; textColor = isCurrentMonth ? '#c62828' : '#ef9a9a'; }
                    if (isSelected) { bgColor = '#5b8bf7'; textColor = '#fff'; }

                    return (
                      <div 
                        key={dateStr} 
                        onClick={() => { setSelectedDate(dateStr); if (!isCurrentMonth) setSelectedMonth(dateStr.substring(0, 7)); }} 
                        style={{ 
                          height: '36px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', 
                          borderRadius: '8px', backgroundColor: bgColor, color: textColor, fontSize: '13px', 
                          fontWeight: isSelected || isNext6Days ? 'bold' : 'normal', position: 'relative', cursor: 'pointer',
                          opacity: isCurrentMonth ? 1 : 0.65
                        }}>
                        {dayNum}
                        {hasLesson && <div style={{ width: '4px', height: '4px', borderRadius: '50%', backgroundColor: isSelected ? '#fff' : '#e57373', position: 'absolute', bottom: '3px' }} />}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 每日課程列表 */}
              <div style={{ marginBottom: '8px', fontWeight: 'bold', fontSize: '14px', color: '#555', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span>📌 {selectedDate} 的課節 ({daySchedule.length})：</span>
                <span style={{ fontSize: '11px', color: '#888', fontWeight: 'normal' }}>💡 雙點擊卡片查看與管理詳情</span>
              </div>

              {daySchedule.length === 0 ? (
                <div style={{ ...cardStyle, textAlign: 'center', color: '#999', padding: '20px' }}>今天沒有排課記錄</div>
              ) : (
                daySchedule.map(item => {
                  const enrolledCount = item.enrolledStudents.length;
                  const courtFeePerPerson = enrolledCount > 0 ? (item.courtFee / enrolledCount) : 0;
                  const pricePerPersonWithCourt = item.pricePerStudent + courtFeePerPerson;

                  return (
                    <div 
                      key={item.id} 
                      onDoubleClick={() => setSelectedLessonModal(item)}
                      style={{ ...cardStyle, borderLeft: '5px solid #5b8bf7', cursor: 'pointer', userSelect: 'none' }}>
                      
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <strong style={{ fontSize: '15px' }}>🏸 {item.courseName}</strong>
                        <span style={{ fontSize: '12px', color: '#666' }}>{item.duration}</span>
                      </div>

                      <div style={{ fontSize: '12px', color: '#555', margin: '6px 0' }}>
                        📅 {item.date} {item.time} | 📍 {item.court}
                      </div>

                      {/* 4. 人數幾何方塊圖案 (例如: 4人小班有4格，已報名顯藍/綠色，未報名灰色) */}
                      <div style={{ display: 'flex', alignItems: 'center', gap: '4px', margin: '8px 0' }}>
                        <span style={{ fontSize: '12px', color: '#666', marginRight: '4px' }}>席位 ({enrolledCount}/{item.maxCapacity}):</span>
                        {Array.from({ length: item.maxCapacity }).map((_, idx) => {
                          const student = item.enrolledStudents[idx];
                          let boxColor = '#e0e0e0'; // 灰色 (空位)
                          if (student) {
                            boxColor = student.isPaid ? '#4eac6d' : '#5b8bf7'; // 已付綠色 / 未付藍色
                          }
                          return (
                            <div 
                              key={idx} 
                              title={student ? `${student.name} (${student.isPaid ? '已付' : '未付'})` : '空位'}
                              style={{ 
                                width: '14px', height: '14px', borderRadius: '3px', backgroundColor: boxColor,
                                border: '1px solid rgba(0,0,0,0.1)' 
                              }} 
                            />
                          );
                        })}
                      </div>

                      {/* 5. 每人學費與場地費計算 */}
                      <div style={{ fontSize: '12px', color: '#444', backgroundColor: '#f0f4f8', padding: '6px 8px', borderRadius: '6px', marginBottom: '10px' }}>
                        學費：HK${item.pricePerStudent} /人 | 場地費：HK${item.courtFee} ({enrolledCount > 0 ? `每人約$${courtFeePerPerson.toFixed(0)}` : '待平攤'})
                        <div style={{ fontWeight: 'bold', color: '#2b580c', marginTop: '2px' }}>
                          每位學員應付總額：HK$ {pricePerPersonWithCourt.toFixed(0)}
                        </div>
                      </div>

                      {/* 3. 卡片按鈕精簡：僅保留加入日曆與取消排課 */}
                      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
                        <button 
                          onClick={(e) => { e.stopPropagation(); addToAppleCalendar(item); }} 
                          style={{ padding: '6px 12px', backgroundColor: '#78c1cc', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                          🗓️ 加入行事曆
                        </button>
                        <button 
                          onClick={(e) => { e.stopPropagation(); handleCancelLesson(item.id); }} 
                          style={{ padding: '6px 12px', backgroundColor: '#e57373', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
                          ❌ 取消排課
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* TAB 2: 收入頁面 */}
          {activeTab === 'revenue' && (
            <div>
              <div style={{ ...cardStyle, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontWeight: 'bold', fontSize: '14px' }}>統計月份：</span>
                <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} style={{ padding: '6px 10px', fontSize: '14px', borderRadius: '6px', border: '1px solid #ccc' }} />
              </div>

              <div style={{ ...cardStyle, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '5px', textAlign: 'center', padding: '15px 10px' }}>
                <div>
                  <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>總預約額</div>
                  <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#5b8bf7' }}>${totalRevenue.toFixed(0)}</div>
                </div>
                <div style={{ borderLeft: '1px solid #eee', borderRight: '1px solid #eee' }}>
                  <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>已實收</div>
                  <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#4eac6d' }}>${paidRevenue.toFixed(0)}</div>
                </div>
                <div>
                  <div style={{ fontSize: '12px', color: '#666', marginBottom: '4px' }}>待追收</div>
                  <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#ef5350' }}>${unpaidRevenue.toFixed(0)}</div>
                </div>
              </div>

              <div style={{ marginBottom: '8px', fontWeight: 'bold', fontSize: '14px', color: '#555' }}>
                📋 明細記錄（連場地費分攤）：
              </div>

              {monthlySchedule.length === 0 ? (
                <div style={{ ...cardStyle, textAlign: 'center', color: '#999', padding: '20px' }}>此月份無課堂紀錄</div>
              ) : (
                monthlySchedule.map(item => {
                  const count = item.enrolledStudents.length || 1;
                  const courtFeePerPerson = item.courtFee / count;
                  const pricePerPerson = item.pricePerStudent + courtFeePerPerson;

                  return (
                    <div key={item.id} style={{ ...cardStyle, borderLeft: '4px solid #5b8bf7' }}>
                      <div style={{ fontWeight: 'bold', fontSize: '14px' }}>🏸 {item.courseName} ({item.date} {item.time})</div>
                      <div style={{ fontSize: '12px', color: '#666', marginTop: '2px' }}>場地費：${item.courtFee} (每人負擔 $${courtFeePerPerson.toFixed(0)})</div>
                      
                      <div style={{ marginTop: '8px', borderTop: '1px dashed #eee', paddingTop: '6px' }}>
                        {item.enrolledStudents.length === 0 ? (
                          <div style={{ fontSize: '12px', color: '#999' }}>尚無學員報名</div>
                        ) : (
                          item.enrolledStudents.map((st, idx) => (
                            <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '13px', margin: '4px 0' }}>
                              <span>👤 {st.name}</span>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <span style={{ fontWeight: 'bold', color: st.isPaid ? '#2e7d32' : '#c62828' }}>
                                  HK$ {pricePerPerson.toFixed(0)}
                                </span>
                                <span style={{ fontSize: '11px', padding: '2px 6px', borderRadius: '4px', backgroundColor: st.isPaid ? '#e8f5e9' : '#ffebee', color: st.isPaid ? '#2e7d32' : '#c62828' }}>
                                  {st.isPaid ? '已繳' : '未繳'}
                                </span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* TAB 3: 學員管理 */}
          {activeTab === 'students' && (
            <div>
              <input placeholder="🔍 搜尋學員姓名或電話..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} style={{ ...inputStyle, marginBottom: '12px' }} />
              
              <div style={{ ...cardStyle, border: editingStudentId ? '2px solid #e6c260' : '1px solid #eee' }}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '15px' }}>{editingStudentId ? '✏️ 修改學員資料' : '➕ 新增學員'}</h3>
                <form onSubmit={handleSaveStudent} style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <input placeholder="姓名" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} required style={inputStyle} />
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <input placeholder="電話" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} style={{ ...inputStyle, flex: 1 }} />
                    <select value={newStudent.level} onChange={e => setNewStudent({...newStudent, level: e.target.value})} style={{ ...inputStyle, flex: 1 }}>
                      <option value="新手">新手</option>
                      <option value="初級">初級</option>
                      <option value="中級">中級</option>
                      <option value="高級">高級</option>
                    </select>
                  </div>
                  <textarea placeholder="備註" value={newStudent.notes} onChange={e => setNewStudent({...newStudent, notes: e.target.value})} style={{ ...inputStyle, height: '50px' }} />
                  <button type="submit" style={{ padding: '10px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold' }}>儲存學員</button>
                </form>
              </div>

              {students.filter(s => s.name.includes(searchQuery)).map(s => (
                <div key={s.id} style={cardStyle}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <strong>{s.name} ({s.level})</strong>
                    <button onClick={() => openWhatsApp(s.phone, `你好 ${s.name}！`)} style={{ padding: '4px 8px', backgroundColor: '#62d890', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px' }}>💬 WhatsApp</button>
                  </div>
                  <div style={{ fontSize: '12px', color: '#555', marginTop: '4px' }}>📞 {s.phone || '無電話'} | 📝 {s.notes || '無備註'}</div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 4: 設定 */}
          {activeTab === 'settings' && (
            <div>
              <div style={cardStyle}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '15px' }}>⚙️ 課程類別與預設價格</h3>
                {courseTypes.map(c => (
                  <div key={c.id} style={{ padding: '8px 0', borderBottom: '1px solid #eee', fontSize: '13px', display: 'flex', justifyContent: 'space-between' }}>
                    <span><strong>{c.name}</strong> (上限{c.maxCapacity}人, {c.duration})</span>
                    <span style={{ fontWeight: 'bold', color: '#5b8bf7' }}>HK$ {c.defaultPrice}/人</span>
                  </div>
                ))}
              </div>

              <div style={cardStyle}>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '15px' }}>🛠️ 系統維護與資料備份</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <button onClick={exportBackupData} style={{ padding: '10px', backgroundColor: '#6c757d', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold', fontSize: '13px' }}>
                    📥 下載備份資料 (.json)
                  </button>
                  <label style={{ padding: '10px', backgroundColor: '#e67e22', color: '#fff', border: 'none', borderRadius: '6px', fontWeight: 'bold', fontSize: '13px', textAlign: 'center', cursor: 'pointer' }}>
                    📤 還原 / 匯入備份資料
                    <input type="file" accept=".json" onChange={importBackupData} style={{ display: 'none' }} />
                  </label>
                </div>
              </div>

              <div style={{ textAlign: 'center', marginTop: '20px', color: '#888', fontSize: '12px' }}>
                當前版本：{APP_VERSION} | 最後更新：{LAST_UPDATED}
              </div>
            </div>
          )}

          {/* 3. 雙擊課程卡片後顯示的完整詳細資料 Modal 彈窗 */}
          {selectedLessonModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2000, padding: '15px' }}>
              <div style={{ backgroundColor: '#fff', padding: '18px', borderRadius: '12px', width: '100%', maxWidth: '400px', maxHeight: '90vh', overflowY: 'auto' }}>
                
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', borderBottom: '1px solid #eee', paddingBottom: '8px' }}>
                  <h3 style={{ margin: 0, fontSize: '16px' }}>🏸 {selectedLessonModal.courseName} 詳情</h3>
                  <button onClick={() => setSelectedLessonModal(null)} style={{ border: 'none', backgroundColor: 'transparent', fontSize: '18px', cursor: 'pointer' }}>✖️</button>
                </div>

                <div style={{ fontSize: '13px', color: '#444', lineHeight: '1.6', marginBottom: '12px' }}>
                  <div>📅 <strong>時間：</strong>{selectedLessonModal.date} {selectedLessonModal.time} ({selectedLessonModal.duration})</div>
                  <div>📍 <strong>地點：</strong>{selectedLessonModal.court}</div>
                  <div>💰 <strong>每人學費：</strong>HK${selectedLessonModal.pricePerStudent}</div>
                  <div>🏟️ <strong>總場地費：</strong>HK${selectedLessonModal.courtFee} (平攤後每人 +HK${(selectedLessonModal.enrolledStudents.length > 0 ? (selectedLessonModal.courtFee / selectedLessonModal.enrolledStudents.length) : 0).toFixed(0)})</div>
                </div>

                {/* 班課學員管理 */}
                <div style={{ backgroundColor: '#f8f9fa', padding: '10px', borderRadius: '8px', marginBottom: '12px' }}>
                  <h4 style={{ margin: '0 0 8px 0', fontSize: '14px' }}>👥 學員名單 ({selectedLessonModal.enrolledStudents.length} / {selectedLessonModal.maxCapacity})</h4>
                  
                  {selectedLessonModal.enrolledStudents.length === 0 ? (
                    <div style={{ fontSize: '12px', color: '#888', marginBottom: '8px' }}>尚無學員，請在下方新增。</div>
                  ) : (
                    selectedLessonModal.enrolledStudents.map((st, idx) => (
                      <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: '#fff', padding: '6px 8px', borderRadius: '6px', marginBottom: '6px', fontSize: '12px', border: '1px solid #eee' }}>
                        <div>
                          <strong>{st.name}</strong>
                          <span style={{ marginLeft: '6px', fontSize: '11px', color: st.isPaid ? '#2e7d32' : '#c62828' }}>
                            ({st.isPaid ? '✅ 已付' : '⏳ 待付'})
                          </span>
                        </div>
                        <div style={{ display: 'flex', gap: '4px' }}>
                          <button 
                            onClick={() => handleTogglePaidStatus(st.name)} 
                            style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: st.isPaid ? '#fabb6e' : '#4eac6d', color: '#fff', cursor: 'pointer' }}>
                            {st.isPaid ? '設為待付' : '設為已付'}
                          </button>
                          <button 
                            onClick={() => handleRemoveStudentFromLesson(st.name)} 
                            style={{ padding: '3px 6px', fontSize: '11px', borderRadius: '4px', border: 'none', backgroundColor: '#e57373', color: '#fff', cursor: 'pointer' }}>
                            移除
                          </button>
                        </div>
                      </div>
                    ))
                  )}

                  {/* 新增學員下拉選單 */}
                  {selectedLessonModal.enrolledStudents.length < selectedLessonModal.maxCapacity && (
                    <div style={{ display: 'flex', gap: '6px', marginTop: '8px' }}>
                      <select value={newStudentForLesson} onChange={e => setNewStudentForLesson(e.target.value)} style={{ ...inputStyle, fontSize: '12px', padding: '4px 6px' }}>
                        <option value="">-- 選擇加入學員 --</option>
                        {students.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                      </select>
                      <button onClick={handleAddStudentToLesson} style={{ padding: '4px 10px', backgroundColor: '#5b8bf7', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', whiteSpace: 'nowrap' }}>
                        加入
                      </button>
                    </div>
                  )}
                </div>

                {/* 更多功能操作 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <button 
                    onClick={() => { handleRenewLesson(selectedLessonModal); setSelectedLessonModal(null); }} 
                    style={{ padding: '8px', backgroundColor: '#fabb6e', color: '#fff', border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    🔄 下週續堂
                  </button>
                  <button 
                    onClick={() => {
                      setEditingLessonId(selectedLessonModal.id);
                      setLessonForm({
                        courseTypeId: courseTypes.find(c => c.name === selectedLessonModal.courseName)?.id || '1',
                        initialStudentName: '',
                        pricePerStudent: selectedLessonModal.pricePerStudent,
                        courtFee: selectedLessonModal.courtFee,
                        date: selectedLessonModal.date,
                        time: selectedLessonModal.time,
                        court: selectedLessonModal.court
                      });
                      setSelectedLessonModal(null);
                    }} 
                    style={{ padding: '8px', backgroundColor: '#e0e0e0', color: '#333', border: 'none', borderRadius: '6px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>
                    ✏️ 修改 / 改期課堂資料
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* 底部導覽列 */}
          <nav style={{ 
            position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: '#ffffff', borderTop: '1px solid #e0e0e0', 
            display: 'flex', justifyContent: 'space-around', paddingTop: '8px',
            paddingBottom: 'calc(8px + env(safe-area-inset-bottom, 12px))', zIndex: 1000, maxWidth: '480px', margin: '0 auto' 
          }}>
            <button onClick={() => setActiveTab('schedule')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'schedule' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>📅<br/>課表</button>
            <button onClick={() => setActiveTab('revenue')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'revenue' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>💰<br/>收入</button>
            <button onClick={() => setActiveTab('students')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'students' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>👤<br/>學員</button>
            <button onClick={() => setActiveTab('settings')} style={{ border: 'none', backgroundColor: 'transparent', color: activeTab === 'settings' ? '#5b8bf7' : '#8e8e93', fontSize: '11px' }}>⚙️<br/>設定</button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BadmintonCoachApp />);
  </script>
</body>
</html>
